<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chat</title>
<style>
:root{color-scheme:dark;--bg:#202020;--fg:#efeff1;--p:#9147ff;--pt:#fff;--card:#18181b;--line:#333;--rowline:#2e2e2e;--alt:#262626;--chip:#26262c;--mut:#8a8a8a;--fs:15px;--es:28px;--bs:22px;--pad:7px;--hl:#ffb300;--ff:system-ui,sans-serif}
:root[data-theme=black]{--bg:#000;--card:#0b0b0d;--line:#2a2a2a;--rowline:#1a1a1a;--alt:#0b0b0b;--chip:#16161a}
:root[data-theme=light]{color-scheme:light;--bg:#fff;--fg:#0e0e10;--card:#f4f4f5;--line:#d4d4d8;--rowline:#e4e4e7;--alt:#f6f6f8;--chip:#e9e9ee;--mut:#6b6b75}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
html{background:var(--bg)}
body{position:fixed;top:0;left:0;right:0;display:flex;will-change:height,transform;flex-direction:column;height:100dvh;background:var(--bg);color:var(--fg);font:var(--fs)/1.5 var(--ff);padding-top:env(safe-area-inset-top)}
header,form{display:flex;gap:6px;padding:8px}
form{padding-bottom:4px}
body.kb #bar{display:none}
body.kb form{padding-bottom:6px}
#bar{display:flex;flex:none;align-items:center;gap:6px;padding:0 8px calc(8px + env(safe-area-inset-bottom))}
input,select{flex:1;min-width:0;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px;font-family:inherit}
button{background:var(--p);color:var(--pt);border:0;border-radius:8px;padding:0 14px;font-size:15px;min-height:40px;font-family:inherit}
button.sec{background:var(--chip);color:var(--fg)}
#sug{display:none;flex-direction:column;flex:none;border-top:1px solid var(--line);background:var(--bg)}
#sug.on{display:flex}
.sr{display:flex;gap:16px;overflow-x:auto;padding:8px 12px;align-items:center;scrollbar-width:none}
.sr:empty{display:none}
.sr button{background:none;color:var(--fg);padding:0;min-height:0;white-space:nowrap;flex:none;font-size:1em;border-radius:6px}
.sr button b{color:var(--p)}
#sue{gap:12px}
#sue button img{height:46px;max-width:140px;object-fit:contain;display:block}
#send{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;min-width:64px}
#send.hot{background:#e91916;color:#fff}
#tabs{display:flex;position:relative;overflow-x:auto;gap:4px;flex:1;min-width:0;scrollbar-width:none}
#tabs button{background:var(--chip);color:var(--fg);white-space:nowrap;min-height:34px;padding:0 12px}
#tabs .on{background:var(--p);color:var(--pt)}
#tabs .new{outline:2px solid var(--p)}
#chat{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:pan-y}
#empty{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:var(--mut)}
#chat.empty #empty{display:grid}
.mch{color:var(--p);font-size:.87em}
.log[data-empty]:empty::after{content:attr(data-empty);margin:auto;color:var(--mut)}
#jump{position:absolute;left:50%;bottom:10px;z-index:5;width:40px;height:40px;min-height:0;padding:0;border-radius:50%;font-size:20px;line-height:1;box-shadow:0 4px 14px #0009;transform:translate(-50%,12px);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#jump.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.log{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0 10px;display:flex;flex-direction:column;visibility:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;will-change:transform}
.log.on,.log.peek{visibility:visible}
.log.anim{transition:transform .3s cubic-bezier(.22,.8,.3,1)}
.log>.m:first-child{margin-top:auto}
.m{flex:none;padding:var(--pad) 10px;margin:0 -10px;border-bottom:1px solid var(--rowline);word-break:break-word}
.m:nth-child(even){background:var(--alt)}
.noalt .m:nth-child(even){background:none}
.m.hl{background:color-mix(in srgb,var(--hl) 22%,transparent)!important;box-shadow:inset 3px 0 var(--hl)}
.m.sys{color:var(--mut);font-style:italic;font-size:.9em}
.ts{color:var(--mut);font-size:.87em}
.nots .ts{display:none}
.nm{cursor:pointer}
.m.h{opacity:.6}
.b{height:var(--bs);width:var(--bs);vertical-align:middle;margin-right:3px}
.e{height:var(--es);vertical-align:middle;margin:0 1px}
.act{font-style:italic}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:8px;padding:3px 8px 3px 4px;font-size:13px}
.chip img{height:24px;width:24px;margin:0}
#notis{position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:8px;right:8px;z-index:50;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.noti{pointer-events:auto;background:var(--card);color:var(--fg);border:1px solid var(--p);border-left-width:5px;border-radius:10px;padding:8px 12px;box-shadow:0 6px 20px #0008;animation:dn .2s ease-out;font-size:14px;word-break:break-word}
.noti b{display:block;color:var(--p)}
@keyframes dn{from{transform:translateY(-120%);opacity:0}}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;width:min(94vw,440px);padding:0}
dialog::backdrop{background:#0009}
#card{padding:16px}
#dlg[open]{display:flex;flex-direction:column;max-height:86dvh}
#dh{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;flex:none}
#dh button{min-height:34px}
#st{display:flex;gap:4px;overflow-x:auto;padding:0 12px 8px;flex:none}
#st button{background:var(--chip);color:var(--fg);min-height:34px;padding:0 14px}
#st .on{background:var(--p);color:var(--pt)}
#sb{overflow-y:auto;padding:0 14px 14px;flex:1;min-height:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--rowline)}
.row>span:first-child{flex:1;min-width:0}
.row small{display:block;color:var(--mut);font-size:12px;line-height:1.3}
.row input[type=checkbox]{flex:none;width:22px;height:22px;padding:0;accent-color:var(--p)}
.row input[type=range]{width:42%;flex:none;padding:0;border:0;background:none;accent-color:var(--p)}
.row input[type=color]{flex:none;width:56px;height:34px;padding:2px}
.row input[type=text]{width:55%;flex:none}
.row select{flex:none;max-width:55%}
.row .val{color:var(--mut);font-size:13px;min-width:34px;text-align:right}
.grp{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 2px}
.note{color:var(--mut);font-size:13px;margin:8px 0}
.kv{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.kv span:first-child{color:var(--mut)}
#sb .wide{width:100%;margin-top:8px}
</style>
</head>
<body>
<div id="chat"><div id="empty">No channels open<br>Tap + to add one</div><button id="jump" aria-label="Jump to latest messages">↓</button></div>
<div id="sug"><div class="sr" id="sun"></div><div class="sr" id="sue"></div></div>
<form id="f">
  <input id="in" placeholder="Send a message" autocomplete="off" enterkeyhint="send">
  <button id="send">Send</button>
</form>
<nav id="bar">
  <div id="tabs"></div>
  <button id="add" aria-label="Add channel">+</button>
  <button id="cog" aria-label="Settings">⚙</button>
</nav>
<div id="notis"></div>
<dialog id="card"></dialog>
<dialog id="dlg">
  <div id="dh"><b>Settings</b><button id="close" class="sec" aria-label="Close">✕</button></div>
  <div id="st"></div>
  <div id="sb"></div>
</dialog>
<script>
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};
const G = { badges: {}, ffz: {}, emotes: {}, bttvBadge: {}, chatterino: {}, dank: {}, tw: {} };
const chans = {};
let cur = null, ws = null, auth = store.get('auth', {});
if (!store.get('chsMig', 0)) { const k = 'chs:' + (store.get('auth', {}).u || 'guest'); if (store.get(k, null) === null) store.set(k, store.get('chs', [])); store.set('chsMig', 1) }
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---------- settings (saved per Twitch account, guests share "guest") ----------
const DEF = {
  theme: 'dark', accent: '#9147ff', font: 'sys', fs: 15, pad: 7, alt: true, fixc: true, es: 28, bs: 22,
  ts: true, h12: false, hist: true, max: 500,
  noti: true, banner: true, bdur: 6, sysnoti: false, sound: 'ding', vol: 70,
  hl: true, hlc: '#ffb300', mutew: '', muteu: '',
  spam: true, hold: 400, modburst: true, dupfix: true, maxspam: 0
};
const FONTS = { sys: 'system-ui,sans-serif', serif: 'Georgia,serif', mono: 'ui-monospace,Menlo,Consolas,monospace', round: 'ui-rounded,"Segoe UI",system-ui,sans-serif' };
const ckey = () => 'cfg:' + (auth.u || 'guest');
const loadCfg = () => ({ ...DEF, ...store.get(ckey(), store.get('cfg:guest', {})) });
let cfg = loadCfg();
const saveCfg = () => store.set(ckey(), cfg);
const ink = hex => { const v = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)); return (.2126 * v[0] + .7152 * v[1] + .0722 * v[2]) / 255 > .6 ? '#000' : '#fff' };
function applyCfg() {
  const r = document.documentElement, s = r.style;
  r.dataset.theme = cfg.theme;
  s.setProperty('--p', cfg.accent); s.setProperty('--pt', ink(cfg.accent));
  s.setProperty('--fs', cfg.fs + 'px'); s.setProperty('--es', cfg.es + 'px'); s.setProperty('--bs', cfg.bs + 'px');
  s.setProperty('--pad', cfg.pad + 'px'); s.setProperty('--hl', cfg.hlc); s.setProperty('--ff', FONTS[cfg.font] || FONTS.sys);
  const b = document.body.classList;
  b.toggle('nots', !cfg.ts); b.toggle('noalt', !cfg.alt);
}
applyCfg();

const fix = u => u.startsWith('//') ? 'https:' + u : u;
const j = async u => { try { const r = await fetch(u); return r.ok ? await r.json() : null } catch { return null } };
const hsl = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h} 60% ${cfg.theme == 'light' ? 35 : 65}%)` };
const badges = (d, o) => { for (const [s, v] of Object.entries(d?.badge_sets || {})) for (const [k, x] of Object.entries(v.versions)) { o[s + '/' + k] = x.image_url_2x || x.image_url_1x; o['t:' + s + '/' + k] = x.title } };
const seven = (l, o) => { for (const e of l || []) { const h = e.data?.host?.url; if (h) o[e.name] = fix(h) + '/2x.webp' } };
const bttv = (l, o) => { for (const e of l || []) o[e.code] = `https://cdn.betterttv.net/emote/${e.id}/2x.webp` };

// ---------- globals: Twitch badges, FFZ badges, 7TV/BTTV emotes ----------
const hx = u => auth.t ? fetch(u, { headers: { 'Client-Id': CLIENT_ID, Authorization: 'Bearer ' + auth.t } }).then(r => r.ok ? r.json() : null).catch(() => null) : null;
// Twitch badges: official Helix API when logged in, old public endpoint as fallback
async function getBadges(kind, room, o) {
  const h = await hx(kind == 'g' ? 'https://api.twitch.tv/helix/chat/badges/global' : 'https://api.twitch.tv/helix/chat/badges?broadcaster_id=' + room);
  if (h?.data) { for (const st of h.data) for (const v of st.versions) { o[st.set_id + '/' + v.id] = v.image_url_2x || v.image_url_1x; o['t:' + st.set_id + '/' + v.id] = v.title } return }
  badges(await j(kind == 'g' ? 'https://badges.twitch.tv/v1/badges/global/display' : `https://badges.twitch.tv/v1/badges/channels/${room}/display`), o);
}
// 7TV badge per user (looked up once, cached)
const sevenP = {};
const sevenUser = uid => sevenP[uid] ||= j(`https://7tv.io/v3/users/twitch/${uid}`).then(d => d?.user?.style || null);
// 7TV paints (name gradients), fetched once per paint id
const paintP = {};
const sevenPaint = id => paintP[id] ||= fetch('https://7tv.io/v3/gql', {
  method: 'POST', headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ query: 'query($l:[ObjectID!]){cosmetics(list:$l){paints{id function color angle image_url repeat stops{at color} shadows{x_offset y_offset radius color}}}}', variables: { l: [id] } })
}).then(r => r.json()).then(d => d?.data?.cosmetics?.paints?.[0] || null).catch(() => null);
const rgba = n => { n >>>= 0; return `rgba(${n >>> 24},${(n >> 16) & 255},${(n >> 8) & 255},${((n & 255) / 255).toFixed(2)})` };
function paint(el, p) {
  const st = (p.stops || []).map(x => `${rgba(x.color)} ${(x.at * 100).toFixed(1)}%`).join(',');
  const r = p.repeat ? 'repeating-' : '';
  const bg = p.function == 'LINEAR_GRADIENT' ? `${r}linear-gradient(${p.angle || 0}deg,${st})`
    : p.function == 'RADIAL_GRADIENT' ? `${r}radial-gradient(circle,${st})`
    : p.image_url ? `url(${p.image_url})` : null;
  if (!bg || (p.function != 'URL' && !st)) return;
  Object.assign(el.style, { backgroundImage: bg, backgroundSize: p.function == 'URL' ? 'cover' : '', backgroundClip: 'text', webkitBackgroundClip: 'text', color: 'transparent', webkitTextFillColor: 'transparent' });
  if (p.shadows?.length) el.style.filter = p.shadows.map(x => `drop-shadow(${x.x_offset}px ${x.y_offset}px ${x.radius}px ${rgba(x.color)})`).join(' ');
}
const fixColor = c => {
  if (!c || c.length != 7) return null;
  if (!cfg.fixc) return c;
  const v = [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  const lum = (.2126 * v[0] + .7152 * v[1] + .0722 * v[2]) / 255;
  if (cfg.theme == 'light') return lum < .65 ? c : `rgb(${v.map(x => (x * .55) | 0).join(',')})`;
  return lum > .25 ? c : `rgb(${v.map(x => (x + 255) >> 1).join(',')})`;
};
async function loadGlobals() {
  const [, ffz, s, b, bb, ch, dk] = await Promise.all([
    getBadges('g', null, G.badges),
    j('https://api.frankerfacez.com/v1/badges/ids'),
    j('https://7tv.io/v3/emote-sets/global'),
    j('https://api.betterttv.net/3/cached/emotes/global'),
    j('https://api.betterttv.net/3/cached/badges'),
    j('https://api.chatterino.com/badges'),
    j('https://api.flxrs.com/api/badges/dank')
  ]);
  seven(s?.emotes, G.emotes);
  bttv(b, G.emotes);
  for (const x of bb || []) if (x.badge?.svg) G.bttvBadge[x.providerId] = { u: x.badge.svg, t: x.badge.description || 'BetterTTV badge' };
  for (const x of ch?.badges || []) for (const u of x.users || []) (G.chatterino[u] ||= []).push({ u: x.image2 || x.image1, t: x.tooltip || 'Chatterino badge' });
  for (const x of (Array.isArray(dk) ? dk : dk?.badges) || []) for (const u of x.users || []) (G.dank[u] ||= []).push({ u: x.url, t: x.tooltip || 'Badge' });
  if (ffz) for (const x of ffz.badges) {
    const img = fix(x.urls['2'] || x.urls['1']);
    for (const u of ffz.users[x.id] || []) (G.ffz[u] ||= []).push({ u: img, c: x.color, t: x.title || x.name || 'FFZ badge' }); // FFZ glyphs are white: the colored background comes from x.color
  }
}

// Twitch's own emotes (for the emote picker): global + everything this account can use
const twUrl = id => `https://static-cdn.jtvnw.net/emoticons/v2/${id}/default/dark/2.0`;
let twWarned = false;
async function loadTwEmotes() {
  const tok = auth.t, out = {}, ids = {}, ck = 'twemo:' + (auth.u || 'guest');
  if (!tok) { G.tw = out; return }
  for (const [k, id] of Object.entries(store.get(ck, {}))) out[k] = twUrl(id); // instant: last known list
  G.tw = out;
  const g = await hx('https://api.twitch.tv/helix/chat/emotes/global');
  for (const e of g?.data || []) out[e.name] = twUrl(e.id);
  if (!auth.id) return;
  const v = await validate(tok);
  if (v && Array.isArray(v.scopes) && !v.scopes.includes('user:read:emotes') && !twWarned) {
    twWarned = true;
    const c = chans[cur]; if (c && c.name[0] != '@') sys(c, 'Subscriber emotes need a new login: Settings > Account > Add account, and log in again to allow emote access.');
  }
  let after = '', got = 0;
  for (let i = 0; i < 150 && auth.t == tok; i++) {
    let d = await hx(`https://api.twitch.tv/helix/chat/emotes/user?user_id=${auth.id}` + (after ? '&after=' + after : ''));
    if (!d) { await sleep(800); d = await hx(`https://api.twitch.tv/helix/chat/emotes/user?user_id=${auth.id}` + (after ? '&after=' + after : '')) } // one retry
    if (!d?.data) break;
    for (const e of d.data) { out[e.name] = twUrl(e.id); ids[e.name] = e.id; got++ }
    after = d.pagination?.cursor; if (!after) break;
  }
  if (got && auth.t == tok) store.set(ck, ids);
}

// ---------- IRC ----------
function parse(raw) {
  let s = raw.trim(); if (!s) return null;
  const tags = {};
  if (s[0] == '@') {
    const i = s.indexOf(' ');
    for (const kv of s.slice(1, i).split(';')) { const e = kv.indexOf('='); if (e > 0) tags[kv.slice(0, e)] = kv.slice(e + 1) }
    s = s.slice(i + 1);
  }
  let prefix = '';
  if (s[0] == ':') { const i = s.indexOf(' '); prefix = s.slice(1, i); s = s.slice(i + 1) }
  let trailing = null;
  const t = s.indexOf(' :'); if (t >= 0) { trailing = s.slice(t + 2); s = s.slice(0, t) }
  const p = s.split(' ').filter(Boolean);
  if (trailing === null && p[0] == 'PRIVMSG' && p.length > 2) trailing = p.slice(2).join(' ');
  return { tags, prefix, cmd: p[0], params: p.slice(1), trailing, nick: prefix.split('!')[0] };
}

function connect() {
  ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  ws.onopen = () => {
    const can = auth.u && auth.t;
    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    ws.send('PASS ' + (can ? (auth.t.startsWith('oauth:') ? auth.t : 'oauth:' + auth.t) : 'SCHMOOPIIE'));
    ws.send('NICK ' + (can ? auth.u.toLowerCase() : 'justinfan' + (10000 + Math.random() * 80000 | 0)));
    for (const n in chans) if (n[0] != '@') ws.send('JOIN #' + n);
  };
  ws.onmessage = e => {
    for (const l of e.data.split('\r\n')) {
      if (l.startsWith('PING')) { ws.send('PONG :tmi.twitch.tv'); continue }
      const m = parse(l); if (m) onIrc(m);
    }
  };
  ws.onclose = () => setTimeout(connect, 3000);
}
function reconnect() { if (spam) spam.stop = true; if (ws) { ws.onclose = null; ws.close() } connect() }

const list = s => (s || '').toLowerCase().split(/[,\n]+/).map(x => x.trim().replace(/^@/, '')).filter(Boolean);
function muted(m) {
  if (list(cfg.muteu).includes((m.nick || '').toLowerCase())) return true;
  const t = (m.trailing || '').toLowerCase();
  return list(cfg.mutew).some(w => t.includes(w));
}

function onIrc(m) {
  if (m.cmd == 'NOTICE' && /authentication failed|improperly formatted auth/i.test(m.trailing || '')) {
    accts = accts.filter(x => x.u != auth.u); saveAccts(); setAuth(null);
    alert('Twitch login expired. Tap ⚙ to log in again.'); return;
  }
  const c = chans[(m.params[0] || '').replace('#', '')];
  if (!c) return;
  if (m.cmd == 'PRIVMSG') { if (!muted(m)) { if (isMention(m)) addMention(c, m); push(c, mkMsg(m, c)) } }
  else if (m.cmd == 'ROOMSTATE') {
    if ('slow' in m.tags) c.slow = +m.tags.slow || 0;
    if (!c.room && m.tags['room-id']) load(c, m.tags['room-id']);
  }
  else if (m.cmd == 'USERSTATE') c.me = m.tags;
  else if (m.cmd == 'NOTICE' && m.tags['msg-id']) {
    sys(c, m.trailing || m.tags['msg-id']);
    if (spam && /^msg_/.test(m.tags['msg-id'])) spam.stop = true; // Twitch refused a message: stop immediately
  }
}

// ---------- message rendering ----------
function mkMsg(m, c, hist) {
  let text = m.trailing || '', action = false;
  if (text.startsWith('\x01ACTION ')) { action = true; text = text.slice(8).replace(/\x01/g, '') }
  text = text.replace(/[\u{E0000}-\u{E007F}\u200B-\u200F\u2060-\u2064\u034F\uFEFF\u180E\uFFFC]/gu, '').trimEnd(); // invisible characters used to bypass the duplicate block
  const d = document.createElement('div');
  d.className = 'm' + (hist ? ' h' : '');
  const img = (url, cls, parent, title, bg) => { const i = new Image(); i.src = url; i.className = cls; i.title = i.alt = title || ''; if (bg) { i.style.backgroundColor = bg; i.style.borderRadius = '4px' } i.onerror = () => i.remove(); i.onload = () => { if (c.pin) toBottom(c) }; parent.append(i) };
  if (cfg.hl && auth.u && (m.nick || '').toLowerCase() != auth.u.toLowerCase() &&
      new RegExp('(^|\\W)@?' + auth.u.replace(/\W/g, '') + '(?!\\w)', 'i').test(text)) d.classList.add('hl');

  const tm = document.createElement('span'); tm.className = 'ts';

// ---------- sending, rate limits, hold-to-spam ----------
// Twitch chat limits per 30s: 20 messages for regular chatters, 100 for moderators/broadcaster.
// Slow mode (per-channel delay) doesn't apply to mods/broadcaster/VIPs.
const WINDOW = 30000 + 150;            // 30s window + small margin for network jitter
const sentLog = [];                     // timestamps of recent sends
const hasBadge = (c, re) => !!c?.me && re.test(c.me.badges || '');
const isMod = c => !!c && (c.me?.mod == '1' || hasBadge(c, /(^|,)(moderator|broadcaster|staff|admin|global_mod)\//) || (!!auth.u && c.name == auth.u.toLowerCase()));
const slowExempt = c => isMod(c) || hasBadge(c, /(^|,)vip\//);
const limitFor = c => cfg.modburst && isMod(c) ? 100 : 20;
const roleOf = c => c.name == (auth.u || '').toLowerCase() ? 'Broadcaster' : isMod(c) ? 'Moderator' : hasBadge(c, /(^|,)vip\//) ? 'VIP' : 'Chatter';

// ms until the next message may be sent (0 = now). pacing=true also spreads sends evenly while spamming.
function waitFor(c, pacing) {
  const now = Date.now(), lim = limitFor(c);
  while (sentLog.length && now - sentLog[0] > WINDOW) sentLog.shift();
  let w = sentLog.length >= lim ? sentLog[sentLog.length - lim] + WINDOW - now : 0;
  if (c.slow && !slowExempt(c)) w = Math.max(w, (c.lastSent || 0) + c.slow * 1000 + 120 - now);
  if (pacing) w = Math.max(w, (c.lastSent || 0) + (lim > 20 ? 15 : Math.ceil(WINDOW / lim)) - now);
  return Math.max(0, Math.ceil(w));
}

function sendMsg(c, text) {
  if (!ws || ws.readyState != 1) return false;
  let wire = text;
  if (cfg.dupfix && wire === c.lastWire) wire = text + ' \u{E0000}'; // Twitch blocks identical consecutive messages
  ws.send(`PRIVMSG #${c.name} :${wire}`);
  const now = Date.now();
  sentLog.push(now); c.lastSent = now; c.lastWire = wire;
  push(c, mkMsg({ tags: { ...(c.me || {}), 'display-name': auth.u, 'user-id': auth.id, emotes: '' }, trailing: text, nick: auth.u, echo: true }, c));
  return true;
}

// ---------- keyboard: opening follows the real viewport; closing glides down on its own ----------
{
  const vv = window.visualViewport, body = document.body, inp = $('#in');
  let polling = 0, stopAt = 0, closing = null;
  const setBody = (h, top) => {
    h = Math.round(h); top = Math.round(top * 100) / 100;
    if (body._h !== h) { body._h = h; body.style.height = h + 'px' }
    if (body._t !== top) { body._t = top; body.style.transform = top > .5 ? `translate3d(0,${top}px,0)` : '' }
  };
  const apply = () => {
    if (!vv) return;
    if (closing) {
      if (closing.anim) return;
      // after the glide: wait until the viewport confirms the keyboard is gone, so it can't shrink the page again
      if (performance.now() > closing.until || vv.height >= innerHeight - 1) closing = null; else return;
    }
    setBody(vv.height, vv.offsetTop);
    if (window.scrollY) scrollTo(0, 0);
  };
  const poll = ms => {
    stopAt = Math.max(stopAt, performance.now() + ms);
    if (polling) return;
    polling = 1;
    const step = () => { apply(); if (performance.now() < stopAt) requestAnimationFrame(step); else polling = 0 };
    requestAnimationFrame(step);
  };
  function closeKb() {
    const h0 = body._h || vv.height, t0 = body._t || 0, h1 = innerHeight;
    if (h0 >= h1 - 2 && !t0) return;
    const st = closing = { anim: true, until: performance.now() + 900 }, t = performance.now(), D = 260;
    const step = now => {
      if (closing !== st) return;
      const p = Math.min(1, Math.max(0, (now - t) / D)), e = 1 - Math.pow(1 - p, 3);
      setBody(h0 + (h1 - h0) * e, t0 * (1 - e));
      if (p < 1) requestAnimationFrame(step); else { st.anim = false; poll(1000) }
    };
    requestAnimationFrame(step);
  }
  if (vv) { vv.addEventListener('resize', () => { apply(); poll(500) }); vv.addEventListener('scroll', apply) }
  inp.addEventListener('focus', () => { closing = null; body.classList.add('kb'); apply(); poll(900) });
  inp.addEventListener('blur', () => { body.classList.remove('kb'); closeKb() });
  addEventListener('scroll', () => { if (window.scrollY) scrollTo(0, 0) });
  // stop iOS from dragging the whole page around while the keyboard is up
  document.addEventListener('touchmove', e => { if (!e.target.closest('.log,#tabs,.sr,dialog,#notis')) e.preventDefault() }, { passive: false });
}

// ---------- swipe left / right to move between chats ----------
{

  const reset = el => { if (el) { el.classList.remove('peek', 'anim'); el.style.transform = '' } };
  area.addEventListener('pointerdown', e => {
    if (e.pointerType == 'mouse' && e.button) return;
    names = order().filter(k => chans[k]);
    if (names.length < 2 || !chans[cur] || st?.settling) return;
    st = { id: e.pointerId, x: e.clientX, y: e.clientY, lock: null, d: 0, v: 0, lx: e.clientX, lt: performance.now() };

      if (commit) { ccEl.style.transform = `translate3d(${d < 0 ? -W : W}px,0,0)`; nbEl.style.transform = 'translate3d(0,0,0)' }
      else { ccEl.style.transform = 'translate3d(0,0,0)'; if (nbEl) nbEl.style.transform = `translate3d(${d < 0 ? W : -W}px,0,0)` }
    });
    ccEl.addEventListener('transitionend', fin, { once: true });
    setTimeout(fin, 380);
  };
  area.addEventListener('pointerup', end);
  area.addEventListener('pointercancel', end);
  area.addEventListener('click', e => { if (Date.now() - dragged < 350) { e.stopPropagation(); e.preventDefault() } }, true);
}

// ---------- autocomplete: @names, plus 7TV / BTTV / FFZ / Twitch emote previews as you type ----------
{
  const inp = $('#in'), box = $('#sug'), sun = $('#sun'), sue = $('#sue');
  const ctx = () => {
    const pos = inp.selectionStart, m = /(^|\s)(@?)(\S*)$/.exec(inp.value.slice(0, pos));
    return m ? { at: !!m[2], q: m[3].toLowerCase(), start: pos - m[2].length - m[3].length, pos } : null;
  };
  const rank = (n, q) => { const l = n.toLowerCase(); return l.startsWith(q) ? 0 : l.includes(q) ? 1 : -1 };
  const hide = () => box.classList.remove('on');
  function pick(text, x) {
    const v = inp.value;
    inp.value = v.slice(0, x.start) + text + ' ' + v.slice(x.pos);
    const p = x.start + text.length + 1; inp.setSelectionRange(p, p);
    hide(); inp.focus();
  }
  function emotesFor(c, q) {
    const seen = new Set(), out = [];
    // this channel's emotes first, then every Twitch emote you can use (subs etc.), then global 7TV/BTTV
    [c.emotes, c.tw, G.tw, G.emotes].forEach((src, si) => { for (const k in src) {
      if (seen.has(k)) continue;
      const r = rank(k, q); if (r < 0) continue;
      seen.add(k); out.push([r, si, k, src[k]]);
    } });
    out.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2].length - b[2].length || a[2].localeCompare(b[2]));
    return out.slice(0, 80).map(x => [x[0], x[2], x[3]]);
  }
  function upd() {
    const c = chans[cur], x = ctx();
    if (!c || !x || (!x.at && x.q.length < 2)) { hide(); return }
    const me = (auth.u || '').toLowerCase();
    const people = Object.entries(c.users || {}).filter(([k, u]) => k != me && (rank(k, x.q) >= 0 || rank(u.n, x.q) >= 0))
      .sort((a, b) => (rank(a[0], x.q) - rank(b[0], x.q)) || b[1].t - a[1].t).slice(0, 12);
    sun.replaceChildren(); sue.replaceChildren();
    const btn = (parent, fn) => { const b = document.createElement('button'); b.type = 'button'; b.addEventListener('mousedown', e => e.preventDefault()); b.onclick = fn; parent.append(b); return b };
    for (const [, u] of people) {
      const b = btn(sun, () => pick('@' + u.n, x)), i = x.q ? u.n.toLowerCase().indexOf(x.q) : -1;
      if (i >= 0) { b.append((x.at ? '@' : '') + u.n.slice(0, i)); const h = document.createElement('b'); h.textContent = u.n.slice(i, i + x.q.length); b.append(h, u.n.slice(i + x.q.length)) }
      else b.textContent = (x.at ? '@' : '') + u.n;
    }
    if (!x.at) for (const [, name, url] of emotesFor(c, x.q)) {
      const b = btn(sue, () => pick(name, x)), im = new Image();
      im.src = url; im.alt = im.title = name; im.loading = 'lazy'; im.onerror = () => b.remove();
      b.append(im);
    }
    box.classList.toggle('on', sun.children.length + sue.children.length > 0);
  }
  inp.addEventListener('input', upd);
  inp.addEventListener('click', upd);
  inp.addEventListener('keyup', e => { if (e.key.startsWith('Arrow')) upd() });
  inp.addEventListener('keydown', e => { if (e.key == 'Tab' && box.classList.contains('on')) { e.preventDefault(); (sue.firstChild || sun.firstChild)?.click() } });
  $('#f').addEventListener('submit', hide);
}

const dateStr = iso => new Date(iso).toLocaleDateString([], { year: 'numeric', month: 'short', day: 'numeric' });
function ago(iso) { // kept for when followage comes back
  const a = new Date(iso), b = new Date();
  let y = b.getFullYear() - a.getFullYear(), mo = b.getMonth() - a.getMonth(), d = b.getDate() - a.getDate();
  if (d < 0) { mo--; d += new Date(b.getFullYear(), b.getMonth(), 0).getDate() }
  if (mo < 0) { y--; mo += 12 }
  return (y ? y + 'y ' : '') + mo + 'm ' + d + 'd';
}
async function openCard(n) {

  const nm = document.createElement('b'); nm.textContent = n.textContent; nm.style.cssText = n.style.cssText; nm.style.fontSize = '18px';
  head.append(av, nm); card.append(head);
  const bv = row('Badges'); bv.textContent = '';

  if (bl.length) { bv.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px'; for (const b of bl) { const ch = el('span', 'chip'); ch.append(b.cloneNode(true), el('span', null, b.title || 'Badge')); bv.append(ch) } }
  else bv.textContent = 'None';

  card.append(cb); card.showModal();
  fol.textContent = 'N/A'; // followage disabled for now

  const [hu, iv, sa] = await Promise.all([
    uid ? hx('https://api.twitch.tv/helix/users?id=' + uid) : null,
    j('https://api.ivr.fi/v2/twitch/user?login=' + encodeURIComponent(login)),
    ch && login != ch ? j(`https://api.ivr.fi/v2/twitch/subage/${encodeURIComponent(login)}/${encodeURIComponent(ch)}`) : null
  ]);
  const u = hu?.data?.[0], i0 = Array.isArray(iv) ? iv[0] : null;
  const created = u?.created_at || i0?.createdAt;
  const avatar = u?.profile_image_url || i0?.logo;
  if (avatar) av.src = avatar;
  cr.textContent = created ? dateStr(created) : 'Unavailable';
  const months = sub !== '' ? +sub : sa?.cumulative?.months;

  sb.textContent = months != null
    ? (months < 1 ? 'Subscribed (under 1 month)' : `${months} month${months == 1 ? '' : 's'}`) + (tier ? ' · Tier ' + tier : '')
    : sa?.statusHidden ? 'Hidden' : sa ? 'Not subscribed' : 'Unavailable';

function mkField(f) {
  const row = el('label', 'row'), l = el('span', null, f.l);
  if (f.h) l.append(el('small', null, f.h));

    else if (f.t == 'range') { c.type = 'range'; c.min = f.min; c.max = f.max; c.step = f.step || 1; c.value = v }
    else if (f.t == 'color') { c.type = 'color'; c.value = v }

  }

// accounts: every login is kept here; `auth` is the active one

function upsertAcct(a) { accts = accts.filter(x => x.u != a.u); accts.push({ u: a.u, t: a.t, id: a.id }); saveAccts() }
function setAuth(a) {
  if (spam) spam.stop = true;

  auth = a ? { u: a.u, t: a.t, id: a.id } : {};

async function switchTo(a) {
  const v = await validate(a.t);
  if (v === null) { removeAcct(a); alert(a.u + "'s login expired. Add the account again."); return }
  setAuth(a);
}
function removeAcct(a) {
  accts = accts.filter(x => x.u != a.u); saveAccts();
  if (auth.u == a.u) setAuth(null); else if ($('#dlg').open) renderSettings();
  try { localStorage.removeItem('chs:' + a.u); localStorage.removeItem('cur:' + a.u) } catch {}
}
function startLogin(id) {
  store.set('cid', id);
  const state = Math.random().toString(36).slice(2);
  store.set('state', state);
  const url = 'https://id.twitch.tv/oauth2/authorize?' + new URLSearchParams({
    client_id: id, redirect_uri: location.origin + location.pathname,
    response_type: 'token', scope: 'chat:read chat:edit moderator:read:followers user:read:emotes', state, force_verify: 'true'
  });
  // open in a browser tab: going through twitch.tv links gets grabbed by the Twitch app on phones
  const w = accts.length ? window.open(url, '_blank') : null;
  if (!w) location.href = url;
}

async function validate(tok) {
  try {
    const r = await fetch('https://id.twitch.tv/oauth2/validate', { headers: { Authorization: 'OAuth ' + tok } });
    return r.ok ? await r.json() : null;
  } catch { return undefined } // network error: keep the token
}
async function finishLogin() {
  const h = new URLSearchParams(location.hash.slice(1));
  const tok = h.get('access_token');
  if (tok) {
    const ok = h.get('state') == store.get('state');
    history.replaceState(null, '', location.pathname + location.search);
    const v = ok && await validate(tok);
    if (v) { auth = { u: v.login, t: tok, id: v.user_id }; store.set('auth', auth); upsertAcct(auth) }
  } else if (auth.t) {
    if (await validate(auth.t) === null) { accts = accts.filter(x => x.u != auth.u); saveAccts(); auth = {}; store.set('auth', auth) }
    else if (auth.u && !accts.some(x => x.u == auth.u)) upsertAcct(auth); // migrate an existing login
  }
  cfg = loadCfg(); applyCfg(); // load this account's settings
}

const loginDone = finishLogin();
