<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chat</title>
<style>
:root{color-scheme:dark;--bg:#202020;--fg:#efeff1;--p:#9147ff;--pt:#fff;--card:#18181b;--line:#333;--rowline:#2e2e2e;--alt:#262626;--chip:#26262c;--mut:#8a8a8a;--fs:15px;--es:28px;--bs:22px;--pad:7px;--hl:#ffb300;--ff:system-ui,sans-serif}
:root[data-theme=black]{--bg:#000;--card:#0b0b0d;--line:#2a2a2a;--rowline:#1a1a1a;--alt:#0b0b0b;--chip:#16161a}
:root[data-theme=light]{color-scheme:light;--bg:#fff;--fg:#0e0e10;--card:#f4f4f5;--line:#d4d4d8;--rowline:#e4e4e7;--alt:#f6f6f8;--chip:#e9e9ee;--mut:#6b6b75}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
html{background:var(--bg)}
body{position:fixed;top:0;left:0;right:0;display:flex;will-change:height,transform;flex-direction:column;height:100dvh;background:var(--bg);color:var(--fg);font:var(--fs)/1.5 var(--ff);padding-top:env(safe-area-inset-top)}
header,form{display:flex;gap:6px;padding:8px}
form{padding-bottom:4px}
body.kb #bar{display:none}
body.kb form{padding:4px 8px 6px}
body.kb input{padding:7px 10px}
body.kb button{min-height:34px}
body.kb .m{padding-top:calc(var(--pad)*.35);padding-bottom:calc(var(--pad)*.35)}
body.kb .m.sys{font-size:.85em}
#bar{display:flex;flex:none;align-items:center;gap:6px;padding:0 8px 3px}
#brand{flex:none;display:flex;align-items:center;justify-content:center;gap:12px;padding:3px 0 calc(6px + env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none;pointer-events:none;--g1:#8f6b2e;--g2:#f6e7b8;--g3:#c9a24f}
#brand span{display:flex;gap:.14em;font:700 14px/1 var(--ff);filter:drop-shadow(0 0 5px rgba(246,231,184,.22))}
#brand b{display:block;font:inherit;background:linear-gradient(100deg,var(--g1) 0%,var(--g2) 25%,var(--g3) 50%,var(--g2) 75%,var(--g1) 100%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:sheen 5s linear infinite,bob 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*-.4s),calc(var(--i)*.14s)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes sheen{to{background-position:-250% 0}}
@media (prefers-reduced-motion:reduce){#brand b{animation:none}}
:root[data-theme=light] #brand{--g1:#6e4f17;--g2:#b8893a;--g3:#8f6b2e;--x:0}
:root[data-theme=light] #brand span{filter:none}
body.kb #brand{display:none}
input,select{flex:1;min-width:0;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px;font-family:inherit}
button{background:var(--p);color:var(--pt);border:0;border-radius:8px;padding:0 14px;font-size:15px;min-height:40px;font-family:inherit}
button.sec{background:var(--chip);color:var(--fg)}
#sug{display:none;flex-direction:column;flex:none;border-top:1px solid var(--line);background:var(--bg)}
#sug.on{display:flex}
.sr{display:flex;gap:16px;overflow-x:auto;padding:8px 12px;align-items:center;scrollbar-width:none}
.sr:empty{display:none}
.sr button{background:none;color:var(--fg);padding:0;min-height:0;white-space:nowrap;flex:none;font-size:1em;border-radius:6px}
.sr button b{color:var(--p)}
#sue{gap:12px}
#sue button img{height:46px;max-width:140px;object-fit:contain;display:block}
#in{padding:8px 10px}
#bar #men{padding:0 9px;min-width:0;flex:none}
#bar #men.on{background:var(--p);color:var(--pt)}
#bar #men.new{outline:2px solid var(--p)}
#bar button{min-height:32px;padding:0 12px}
form{padding:6px 8px 2px}
#send{min-height:36px}
#send{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;min-width:64px}
#send.hot{background:#e91916;color:#fff}
#tabs{display:flex;position:relative;overflow-x:auto;gap:4px;flex:1;min-width:0;scrollbar-width:none}
#tabs button{background:var(--chip);color:var(--fg);white-space:nowrap;min-height:30px;padding:0 10px}
#tabs .on{background:var(--p);color:var(--pt)}
#tabs .new{outline:2px solid var(--p)}
#chat{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:pan-y}
#empty{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:var(--mut)}
#chat.empty #empty{display:grid}
.mch{color:var(--p);font-size:.87em}
.log[data-empty]:empty::after{content:attr(data-empty);margin:auto;color:var(--mut)}
#jump{position:absolute;left:50%;bottom:10px;z-index:5;width:40px;height:40px;min-height:0;padding:0;border-radius:50%;font-size:20px;line-height:1;box-shadow:0 4px 14px #0009;transform:translate(-50%,12px);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#jump.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.log{overflow-anchor:none;position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0 10px;display:flex;flex-direction:column;visibility:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;will-change:transform}
.log.on,.log.peek{visibility:visible}
.log.anim{transition:transform .3s cubic-bezier(.22,.8,.3,1)}
.log>.m:first-child{margin-top:auto}
.m{flex:none;padding:var(--pad) 10px;margin:0 -10px;border-bottom:1px solid var(--rowline);word-break:break-word}
.m:nth-child(even){background:var(--alt)}
.noalt .m:nth-child(even){background:none}
.m.hl{background:color-mix(in srgb,var(--hl) 22%,transparent)!important;box-shadow:inset 3px 0 var(--hl)}
.m.sys{color:var(--mut);font-style:italic;font-size:.9em}
.ts{color:var(--mut);font-size:.87em}
.nots .ts{display:none}
.nm{cursor:pointer}
.mn{cursor:pointer;font-weight:600;color:var(--p);border-radius:4px;padding:0 2px;margin:0 -1px;transition:background-color .15s}
.mn:hover,.mn:active{background-color:color-mix(in srgb,var(--p) 18%,transparent)}
.m.h{opacity:.6}
.b{height:var(--bs);width:var(--bs);vertical-align:middle;margin-right:3px}
.e{height:var(--es);vertical-align:middle;margin:0 1px}
.act{font-style:italic}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:8px;padding:3px 8px 3px 4px;font-size:13px}
.chip img{height:24px;width:24px;margin:0}
#notis{position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:8px;right:8px;z-index:50;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.noti{pointer-events:auto;background:var(--card);color:var(--fg);border:1px solid var(--p);border-left-width:5px;border-radius:10px;padding:8px 12px;box-shadow:0 6px 20px #0008;animation:dn .2s ease-out;font-size:14px;word-break:break-word}
.noti b{display:block;color:var(--p)}
@keyframes dn{from{transform:translateY(-120%);opacity:0}}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;width:min(94vw,440px);padding:0}
dialog::backdrop{background:#0009}
#card{padding:16px}
#card[open]{display:flex;flex-direction:column;max-height:86dvh}
#card>*{flex:none}
#card>.uh{flex:1 1 auto;min-height:130px;overflow-y:auto;overscroll-behavior:contain;padding:0 10px;margin:4px 0;border:1px solid var(--rowline);border-radius:8px}
#card>.uh:empty::after{content:'No messages seen yet';display:block;padding:12px 0;color:var(--mut);text-align:center}
#dlg[open]{display:flex;flex-direction:column;max-height:86dvh}
#dh{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;flex:none}
#dh button{min-height:34px}
#st{display:flex;gap:4px;overflow-x:auto;padding:0 12px 8px;flex:none}
#st button{background:var(--chip);color:var(--fg);min-height:34px;padding:0 14px}
#st .on{background:var(--p);color:var(--pt)}
#sb{overflow-y:auto;padding:0 14px 14px;flex:1;min-height:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--rowline)}
.row>span:first-child{flex:1;min-width:0}
.row small{display:block;color:var(--mut);font-size:12px;line-height:1.3}
.row input[type=checkbox]{flex:none;width:22px;height:22px;padding:0;accent-color:var(--p)}
.row input[type=range]{width:42%;flex:none;padding:0;border:0;background:none;accent-color:var(--p)}
.row input[type=color]{flex:none;width:56px;height:34px;padding:2px}
.row input[type=text]{width:55%;flex:none}
.row select{flex:none;max-width:55%}
.row .val{color:var(--mut);font-size:13px;min-width:34px;text-align:right}
.grp{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 2px}
.note{color:var(--mut);font-size:13px;margin:8px 0}
.kv{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.kv span:first-child{color:var(--mut)}
#sb .wide{width:100%;margin-top:8px}

.nobadges .b{display:none}
.nopaint [data-pid]{background-image:none!important;color:var(--nc,inherit)!important;-webkit-text-fill-color:var(--nc,currentColor)!important;filter:none!important}
.b,.nm,.mn{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#tip{position:fixed;inset:auto;margin:0;overflow:visible;z-index:90;max-width:min(72vw,240px);background:var(--card);color:var(--fg);border:1px solid var(--p);border-radius:6px;padding:3px 7px;font:11px/1.3 var(--ff);box-shadow:0 4px 14px #0009;pointer-events:none;word-break:break-word}
#tip:not(.on){display:none}
#tip.on{display:block}
</style>
</head>
<body>
<div id="chat"><div id="empty">No channels open<br>Tap + to add one</div><button id="jump" aria-label="Jump to latest messages">↓</button></div>
<div id="sug"><div class="sr" id="sun"></div><div class="sr" id="sue"></div></div>
<form id="f">
  <input id="in" placeholder="Send a message" autocomplete="off" enterkeyhint="send">
  <button id="send">Send</button>
</form>
<nav id="bar">
  <div id="tabs"></div>
  <button id="add" aria-label="Add channel">+</button>
  <button id="men" class="sec" aria-label="Mentions">@</button>
  <button id="cog" aria-label="Settings">⚙</button>
</nav>
<div id="brand"><span aria-label="MyChats"><b style="--i:0">M</b><b style="--i:1">y</b><b style="--i:2">C</b><b style="--i:3">h</b><b style="--i:4">a</b><b style="--i:5">t</b><b style="--i:6">s</b></span></div>
<div id="notis"></div>
<dialog id="card"></dialog>
<dialog id="dlg">
  <div id="dh"><b>Settings</b><button id="close" class="sec" aria-label="Close">✕</button></div>
  <div id="st"></div>
  <div id="sb"></div>
</dialog>
<script>
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },

};
const G = { mine: {}, badges: {}, ffz: {}, emotes: {}, bttvBadge: {}, chatterino: {}, dank: {}, tw: {} };
const chans = {};
let cur = null, ws = null, auth = store.get('auth', {});
if (!store.get('chsMig', 0)) { const k = 'chs:' + (store.get('auth', {}).u || 'guest'); if (store.get(k, null) === null) store.set(k, store.get('chs', [])); store.set('chsMig', 1) }
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---------- settings (saved per Twitch account, guests share "guest") ----------
const DEF = {
  theme: 'black', tv: 1, accent: '#9147ff', font: 'sys', fs: 13, pad: 2, alt: true, fixc: true, es: 28, bs: 18, lv: 2,
  ts: true, h12: false, hist: true, max: 500, badges: true, paints: true, tips: true,
  noti: true, banner: true, bdur: 6, sysnoti: false, sound: 'ding', vol: 70,
  hl: true, hlc: '#ffb300', mutew: '', muteu: '',
  spam: true, hold: 400, modburst: true, dupfix: true, maxspam: 0
};
const FONTS = { sys: 'system-ui,sans-serif', serif: 'Georgia,serif', mono: 'ui-monospace,Menlo,Consolas,monospace', round: 'ui-rounded,"Segoe UI",system-ui,sans-serif' };
const ckey = () => 'cfg:' + (auth.u || 'guest');
// lv = layout version: one time, move saved sizes to the new compact defaults (you can still change them in Settings > Look)
const loadCfg = () => {
  const saved = store.get(ckey(), store.get('cfg:guest', {})), c = { ...DEF, ...saved };
  if (saved.lv !== DEF.lv) Object.assign(c, { fs: DEF.fs, pad: DEF.pad, es: DEF.es, bs: DEF.bs, lv: DEF.lv });
  if (saved.tv !== 1) Object.assign(c, { theme: 'black', tv: 1 }); // one time: switch to the pure black theme (you can still change it in Settings > Look)
  return c;
};
let cfg = loadCfg();
const saveCfg = () => store.set(ckey(), cfg);
const ink = hex => { const v = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)); return (.2126 * v[0] + .7152 * v[1] + .0722 * v[2]) / 255 > .6 ? '#000' : '#fff' };
function applyCfg() {
  const r = document.documentElement, s = r.style;
  r.dataset.theme = cfg.theme;
  s.setProperty('--p', cfg.accent); s.setProperty('--pt', ink(cfg.accent));
  s.setProperty('--fs', cfg.fs + 'px'); s.setProperty('--es', cfg.es + 'px'); s.setProperty('--bs', cfg.bs + 'px');
  s.setProperty('--pad', cfg.pad + 'px'); s.setProperty('--hl', cfg.hlc); s.setProperty('--ff', FONTS[cfg.font] || FONTS.sys);
  const b = document.body.classList;
  b.toggle('nots', !cfg.ts); b.toggle('noalt', !cfg.alt); b.toggle('nobadges', !cfg.badges); b.toggle('nopaint', !cfg.paints);
}
applyCfg();

const fix = u => u.startsWith('//') ? 'https:' + u : u;
const to = ms => (typeof AbortSignal != 'undefined' && AbortSignal.timeout) ? AbortSignal.timeout(ms) : undefined;
const j = async u => {
  for (let t = 0; t < 3; t++) {
    try { const r = await fetch(u, { signal: to(9000) }); if (r.ok) return await r.json(); if (r.status < 500 && r.status != 429) return null } catch {}
    await sleep(400 * (t + 1));
  }
  return null;
};
const hsl = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h} 60% ${cfg.theme == 'light' ? 35 : 65}%)` };
const badges = (d, o) => { for (const [s, v] of Object.entries(d?.badge_sets || {})) for (const [k, x] of Object.entries(v.versions)) { o[s + '/' + k] = x.image_url_2x || x.image_url_1x; o['t:' + s + '/' + k] = x.title } };
const seven = (l, o) => { for (const e of l || []) { const h = e.data?.host?.url; if (h) o[e.name] = fix(h) + '/2x.webp' } };
const bttv = (l, o) => { for (const e of l || []) o[e.code] = `https://cdn.betterttv.net/emote/${e.id}/2x.webp` };

// ---------- globals: Twitch badges, FFZ badges, 7TV/BTTV emotes ----------
const hx = u => auth.t ? fetch(u, { headers: { 'Client-Id': CLIENT_ID, Authorization: 'Bearer ' + auth.t } }).then(r => r.ok ? r.json() : null).catch(() => null) : null;
// Twitch badges: official Helix API when logged in; public mirrors when logged out (Twitch's old public endpoint was shut down)
const ivrBadges = (d, o) => { let n = 0; for (const st of (Array.isArray(d) ? d : d?.data) || []) { const id = st.setID ?? st.set_id; for (const v of st.versions || []) { const u = v.image_url_2x || v.image_url_1x; if (!id || !u) continue; o[id + '/' + v.id] = u; o['t:' + id + '/' + v.id] = v.title || id; n++ } } return n };
const CORE_BADGES = { broadcaster: ['5527c58c-fb7d-422d-b71b-f309dcb85cc1', 'Broadcaster'], moderator: ['3267646d-33f0-4b17-b3df-f923a41db1d0', 'Moderator'], vip: ['b817aba4-fad8-49e2-b88a-7cc744dfa6ec', 'VIP'], staff: ['d97c37bd-a6f5-4c38-8f57-4e4bef88af34', 'Staff'], admin: ['9ef7e029-4cdf-4d4d-a0d5-e2b3fb2583fe', 'Admin'], global_mod: ['9384c43e-4ce7-4e94-b2a1-b93656896eb6', 'Global Moderator'], partner: ['d12a2e27-16f6-41d0-ab77-b780518f00a3', 'Verified'], premium: ['bbbe0db0-a598-423e-86d0-f9fb98ca1933', 'Prime Gaming'], turbo: ['bd444ec6-8f34-4bf9-91f4-af1e3428d80f', 'Turbo'] };
async function getBadges(kind, room, o, name) {
  const h = await hx(kind == 'g' ? 'https://api.twitch.tv/helix/chat/badges/global' : 'https://api.twitch.tv/helix/chat/badges?broadcaster_id=' + room);
  if (h?.data) { for (const st of h.data) for (const v of st.versions) { o[st.set_id + '/' + v.id] = v.image_url_2x || v.image_url_1x; o['t:' + st.set_id + '/' + v.id] = v.title } return }
  const one = async u => { try { const r = await fetch(u, { signal: to(9000) }); return r.ok ? await r.json() : null } catch { return null } };
  if (kind == 'g') {
    if (ivrBadges(await one('https://api.ivr.fi/v2/twitch/badges/global'), o)) return;
  } else {
    if (ivrBadges(await one('https://api.ivr.fi/v2/twitch/badges/channel?id=' + room), o)) return;
    if (name && ivrBadges(await one('https://api.ivr.fi/v2/twitch/badges/channel?login=' + encodeURIComponent(name)), o)) return;
  }
  badges(await one(kind == 'g' ? 'https://badges.twitch.tv/v1/badges/global/display' : `https://badges.twitch.tv/v1/badges/channels/${room}/display`), o);
  if (kind == 'g' && !Object.keys(o).length) for (const [k, [id, t]] of Object.entries(CORE_BADGES)) { o[k + '/1'] = `https://static-cdn.jtvnw.net/badges/v1/${id}/2`; o['t:' + k + '/1'] = t } // last resort: the main role badges
}
// 7TV badge per user (looked up once, cached)
const seen = {}; // login -> { uid, color, n } for every chatter we have seen (so @mentions can show their color / 7TV paint)
// 7TV lookups: cached on this device (so badges/paints show instantly next time), retried, and re-checked in the background
const SVU = 'sv:u', SVP = 'sv:p', H3 = 12 * 3600e3, H24 = 24 * 3600e3;
const svu = store.get(SVU, {}), svp = store.get(SVP, {});
let svT = 0;
const svFlush = () => { clearTimeout(svT); svT = setTimeout(() => {
  const trim = (o, n) => { const k = Object.keys(o); if (k.length > n) for (const x of k.sort((a, b) => o[a].t - o[b].t).slice(0, k.length - n)) delete o[x] };
  trim(svu, 1500); trim(svp, 150); store.set(SVU, svu); store.set(SVP, svp);
}, 2000) };
let svBusy = 0; const svWait = [];
const svSlot = async () => { if (svBusy >= 20) await new Promise(r => svWait.push(r)); svBusy++ };
const svDone = () => { svBusy--; svWait.shift()?.() };
const sevenP = {}, sevenFail = {};
// resolves to { badge_id, paint_id }, null (no 7TV cosmetics), or undefined (lookup failed: try again later)
const sevenUser = uid => {
  if (sevenP[uid]) return sevenP[uid];
  const c = svu[uid]; if (c && Date.now() - c.t < (c.s ? H3 : 600e3)) return sevenP[uid] = Promise.resolve(c.s);
  if (sevenFail[uid] && Date.now() - sevenFail[uid] < 6000) return Promise.resolve(undefined);
  return sevenP[uid] = (async () => {
    await svSlot();
    try {
      for (let t = 0; t < 4; t++) {
        try {
          const r = await fetch(`https://7tv.io/v3/users/twitch/${uid}`, { signal: to(4500) });
          if (r.status == 404) { svu[uid] = { s: null, t: Date.now() }; svFlush(); setTimeout(() => delete sevenP[uid], 600e3); return null }
          if (r.ok) {
            const st = (await r.json())?.user?.style, v = st && (st.badge_id || st.paint_id) ? { badge_id: st.badge_id || null, paint_id: st.paint_id || null } : null;
            svu[uid] = { s: v, t: Date.now() }; svFlush(); if (!v) setTimeout(() => delete sevenP[uid], 600e3); return v;
          }
        } catch {}
        await sleep(400 * (t + 1));
      }
      delete sevenP[uid]; sevenFail[uid] = Date.now(); return undefined;
    } finally { svDone() }
  })();
};
const paintP = {}, paintFail = {};
const sevenPaint = id => {
  if (paintP[id]) return paintP[id];
  const c = svp[id]; if (c && Date.now() - c.t < H24) return paintP[id] = Promise.resolve(c.p);
  if (paintFail[id] && Date.now() - paintFail[id] < 6000) return Promise.resolve(null);
  return paintP[id] = (async () => {
    for (let t = 0; t < 4; t++) {
      const p = await fetchPaint(id);
      if (p) { svp[id] = { p, t: Date.now() }; svFlush(); return p }
      await sleep(400 * (t + 1));
    }
    delete paintP[id]; paintFail[id] = Date.now(); return null;
  })();

function parse(raw) {
  let s = raw.trim(); if (!s) return null;
  const tags = {};
  if (s[0] == '@') {
    const i = s.indexOf(' ');
    for (const kv of s.slice(1, i).split(';')) { const e = kv.indexOf('='); if (e > 0) tags[kv.slice(0, e)] = kv.slice(e + 1) }
    s = s.slice(i + 1);
  }
  let prefix = '';
  if (s[0] == ':') { const i = s.indexOf(' '); prefix = s.slice(1, i); s = s.slice(i + 1) }
  let trailing = null;
  const t = s.indexOf(' :'); if (t >= 0) { trailing = s.slice(t + 2); s = s.slice(0, t) }
  const p = s.split(' ').filter(Boolean);
  if (trailing === null && p[0] == 'PRIVMSG' && p.length > 2) trailing = p.slice(2).join(' ');
  return { tags, prefix, cmd: p[0], params: p.slice(1), trailing, nick: prefix.split('!')[0] };
}

function connect() {

    ws.send('NICK ' + (can ? auth.u.toLowerCase() : 'justinfan' + (10000 + Math.random() * 80000 | 0)));
    for (const n in chans) if (n[0] != '@') ws.send('JOIN #' + n);

  ws.onclose = () => setTimeout(connect, 3000);
}

{

async function modCall(method, path, body) {
  if (!auth.t) return { ok: false, msg: 'Not logged in' };

    const r = await fetch('https://api.twitch.tv/helix/moderation/' + path, {
      method, body: body ? JSON.stringify({ data: body }) : undefined,
      headers: { 'Client-Id': CLIENT_ID, Authorization: 'Bearer ' + auth.t, ...(body ? { 'Content-Type': 'application/json' } : {}) }

}

    ['h', 'Hold to spam'],
    { k: 'spam', t: 'bool', l: 'Hold Send to repeat', h: 'Type a message, then press and hold Send' },
    { k: 'hold', t: 'range', l: 'Hold delay', min: 200, max: 1200, step: 50, u: 'ms' },
    { k: 'maxspam', t: 'range', l: 'Stop after', min: 0, max: 300, step: 5, z: 'never' },
    ['h', 'Limits'],
    { k: 'modburst', t: 'bool', l: 'Mods: use full 100 per 30s', h: 'Regular chatters are always held to 20 per 30s, evenly spaced, and slow mode' },
    { k: 'dupfix', t: 'bool', l: 'Bypass duplicate-message block', h: 'Adds an invisible character to repeats' }
  ]
};
let stab = 'Account';
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e };
const grp = t => el('div', 'grp', t);
const kv = (a, b) => { const r = el('div', 'kv'); r.append(el('span', null, a), el('span', null, b)); return r };
const wide = (t, fn, sec) => { const b = el('button', 'wide' + (sec ? ' sec' : ''), t); b.onclick = fn; return b };

function mkField(f) {
  const row = el('label', 'row'), l = el('span', null, f.l);
  if (f.h) l.append(el('small', null, f.h));
  let c, out;
  const v = cfg[f.k];
  if (f.t == 'sel') { c = el('select'); for (const [val, lab] of f.o) c.add(new Option(lab, val)); c.value = v }
  else {
    c = el('input');
    if (f.t == 'bool') { c.type = 'checkbox'; c.checked = !!v }
    else if (f.t == 'range') { c.type = 'range'; c.min = f.min; c.max = f.max; c.step = f.step || 1; c.value = v }
    else if (f.t == 'color') { c.type = 'color'; c.value = v }
    else { c.type = 'text'; c.value = v; c.placeholder = f.p || ''; c.autocapitalize = 'none'; c.autocomplete = 'off' }
  }
  const fmt = () => cfg[f.k] == 0 && f.z ? f.z : cfg[f.k] + (f.u || '');
  c.addEventListener(f.t == 'text' ? 'change' : 'input', () => {
    cfg[f.k] = f.t == 'bool' ? c.checked : f.t == 'range' ? +c.value : c.value;
    saveCfg(); applyCfg(); if (out) out.textContent = fmt();
  });
  if (f.after) c.addEventListener('change', f.after);
  row.append(l);
  if (f.t == 'range') { out = el('span', 'val', fmt()); row.append(out) }
  row.append(c);
  return row;
}

// accounts: every login is kept here; `auth` is the active one
let accts = store.get('accts', []);
const saveAccts = () => store.set('accts', accts);
function upsertAcct(a) { accts = accts.filter(x => x.u != a.u); accts.push({ u: a.u, t: a.t, id: a.id }); saveAccts() }
function setAuth(a) {
  if (spam) spam.stop = true;
  saveMentions(); // the outgoing account keeps its own mentions
  auth = a ? { u: a.u, t: a.t, id: a.id } : {};
  store.set('auth', auth);
  cfg = loadCfg(); applyCfg();
  sentLog.length = 0;
  for (const k of real()) Object.assign(chans[k], { me: null, lastSent: 0, lastText: null, dupN: 0 }); // per-account chat state
  restoreMentions(); // the new account's mentions
  reconnect(); loadTwEmotes(); // same chat tabs, now chatting as the new account
  tabs(); saveChs();
  if ($('#dlg').open) renderSettings();
}
async function switchTo(a) {
  const v = await validate(a.t);
  if (v === null) { removeAcct(a); alert(a.u + "'s login expired. Add the account again."); return }
  setAuth(a);
}
function removeAcct(a) {
  accts = accts.filter(x => x.u != a.u); saveAccts();
  if (auth.u == a.u) setAuth(null); else if ($('#dlg').open) renderSettings();
  try { localStorage.removeItem('chs:' + a.u); localStorage.removeItem('cur:' + a.u) } catch {}
}
function startLogin(id) {
  store.set('cid', id);
  const state = Math.random().toString(36).slice(2);
  store.set('state', state);
  const url = 'https://id.twitch.tv/oauth2/authorize?' + new URLSearchParams({
    client_id: id, redirect_uri: location.origin + location.pathname,
    response_type: 'token', scope: 'chat:read chat:edit moderator:read:followers user:read:emotes moderator:manage:banned_users moderator:manage:chat_messages moderator:manage:warnings', state, force_verify: 'true'
  });
  // open in a browser tab: going through twitch.tv links gets grabbed by the Twitch app on phones
  const w = accts.length ? window.open(url, '_blank') : null;
  if (!w) location.href = url;
}
function acctQuick() {
  const r = el('label', 'row'), s = el('select');
  r.append(el('span', null, 'Account'));
  s.add(new Option('Guest (read-only)', ''));
  for (const a of accts) s.add(new Option(a.u, a.u));
  s.value = auth.u || '';
  s.onchange = () => { const a = accts.find(x => x.u == s.value); a ? switchTo(a) : setAuth(null) };
  r.append(s);
  return [r, wide('Add account', () => { const id = CLIENT_ID || store.get('cid', ''); if (id) startLogin(id); else openSettings('Account') }, true)];
}
function alertExtras(sb) {
  sb.append(wide('Test alert', () => { banner({ name: cur || 'channel' }, 'someone', '@' + (auth.u || 'you') + ' this is a test mention') }, true));
}
function openSettings(t) { if (t) stab = t; renderSettings(); if (!$('#dlg').open) $('#dlg').showModal() }
function renderSettings() {
  const st = $('#st'); st.replaceChildren();
  for (const n of ['Account', 'Look', 'Chat', 'Send', 'Alerts', 'Data']) {
    const b = el('button', n == stab ? 'on' : '', n); b.onclick = () => { stab = n; renderSettings() }; st.append(b);
  }
  const sb = $('#sb'); sb.replaceChildren();
  const on = !!(auth.u && auth.t);
  if (stab == 'Account') {
    sb.append(grp('Accounts'));
    if (!accts.length) sb.append(el('div', 'note', 'Not logged in. You can read chat; log in to send messages.'));
    for (const a of accts) {
      const r = el('div', 'row'), l = el('span', null, a.u);
      if (a.u == auth.u) l.append(el('small', null, 'Active'));
      r.append(l);
      if (a.u != auth.u) { const b = el('button', null, 'Switch'); b.onclick = () => switchTo(a); r.append(b) }
      const x = el('button', 'sec', 'Remove'); x.onclick = () => { if (confirm('Remove ' + a.u + ' from this device?')) removeAcct(a) }; r.append(x);
      sb.append(r);
    }
    if (on) sb.append(wide('Use as guest (read-only)', () => setAuth(null), true));
    let cid = null;
    if (!CLIENT_ID) { cid = el('input'); cid.placeholder = 'Twitch Client ID (one-time)'; cid.autocapitalize = 'none'; cid.autocomplete = 'off'; cid.value = store.get('cid', ''); cid.style.cssText = 'width:100%;margin-top:8px'; sb.append(cid) }
    sb.append(wide(accts.length ? 'Add account' : 'Login with Twitch', () => {
      const id = CLIENT_ID || cid.value.trim();
      if (!id) { cid.focus(); return }
      startLogin(id);
    }));
    const c = chans[cur];
    if (on && c && c.name[0] != '@') {
      sb.append(grp('Current channel · #' + c.name));
      const lim = limitFor(c);
      sb.append(kv('Your role', c.me ? roleOf(c) : 'Chatter (detecting…)'));
      sb.append(kv('Rate limit', lim + ' messages / 30s'));
      sb.append(kv('Slow mode', c.slow ? c.slow + 's' + (slowExempt(c) ? ' (exempt)' : '') : 'Off'));
    }
  } else if (stab == 'Data') {
    sb.append(grp('Your settings'));
    sb.append(wide('Export settings (copy)', () => {
      const s = JSON.stringify(cfg);
      (navigator.clipboard?.writeText(s) || Promise.reject()).then(() => alert('Settings copied.')).catch(() => prompt('Copy your settings:', s));
    }, true));
    sb.append(wide('Import settings (paste)', () => {
      const s = prompt('Paste settings JSON'); if (!s) return;
      try {
        const o = JSON.parse(s); let n = 0;
        for (const k in DEF) if (k in o && typeof o[k] == typeof DEF[k]) { cfg[k] = o[k]; n++ }
        saveCfg(); applyCfg(); renderSettings(); alert(n + ' settings imported.');
      } catch { alert('That is not valid settings JSON.') }
    }, true));
    sb.append(wide('Reset all settings to default', () => {
      if (!confirm('Reset all settings?')) return;
      cfg = { ...DEF }; saveCfg(); applyCfg(); renderSettings();
    }, true));
  } else {
    if (stab == 'Chat') sb.append(grp('Chatting as'), ...acctQuick());
    for (const f of FIELDS[stab]) sb.append(Array.isArray(f) ? grp(f[1]) : mkField(f));
    if (stab == 'Alerts') alertExtras(sb);
  }
}
$('#cog').onclick = () => openSettings('Account');
$('#close').onclick = () => $('#dlg').close();

async function validate(tok) {
  try {
    const r = await fetch('https://id.twitch.tv/oauth2/validate', { headers: { Authorization: 'OAuth ' + tok } });
    return r.ok ? await r.json() : null;
  } catch { return undefined } // network error: keep the token
}
async function finishLogin() {
  const h = new URLSearchParams(location.hash.slice(1));
  const tok = h.get('access_token');
  if (tok) {
    const ok = h.get('state') == store.get('state');
    history.replaceState(null, '', location.pathname + location.search);
    const v = ok && await validate(tok);
    if (v) { auth = { u: v.login, t: tok, id: v.user_id }; store.set('auth', auth); upsertAcct(auth) }
  } else if (auth.t) {
    if (await validate(auth.t) === null) { accts = accts.filter(x => x.u != auth.u); saveAccts(); auth = {}; store.set('auth', auth) }
    else if (auth.u && !accts.some(x => x.u == auth.u)) upsertAcct(auth); // migrate an existing login
  }
  cfg = loadCfg(); applyCfg(); // load this account's settings
}

const loginDone = finishLogin();
const globalsReady = loginDone.then(loadGlobals);
loginDone.then(loadTwEmotes);
loginDone.then(loadMine);
loginDone.then(() => { if (auth.id) prefetch7(auth.id) }); // your own 7TV badge/paint is ready before you send your first message
loginDone.then(() => { loadSession(); connect() });
globalsReady.then(() => { for (const k in chans) if (k[0] != '@') reBadge(chans[k]) }); // badges from the global lists reach messages that came in before the lists were ready
</script>
</body>
