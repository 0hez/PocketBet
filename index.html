<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#120a1c">
<title>Pocket Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120a1c;--panel:#1d1230;--card:#251740;--sel:#32205a;--ink:#fff6e5;--dim:#9a8bb5;--gold:#ffd23f;--cyan:#3ee0cf;--coral:#ff5d73}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Fredoka,ui-rounded,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;background:var(--panel)}
#top .cn,#balDd .cn,.wrow .cn{flex:none;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-style:normal;font-weight:800}
.cn.g{background:radial-gradient(circle at 35% 30%,#fff1a6,#e0a100);color:#6b4500;border:2px solid #ffd23f}.cn.r{background:radial-gradient(circle at 35% 30%,#8ff5ab,#1f9a45);color:#04290f;border:2px solid #6dff9a}
.bal[data-m=play] b{color:#ffd96a}.bal[data-m=real] b{color:#6dff9a}
#balDd .r.w{border-radius:8px;cursor:pointer}#balDd .r.w span{display:flex;align-items:center;gap:6px}#balDd .r.w.on{background:#233189}
.wal{position:relative}.wal.rdy::after{content:'';position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;background:#ffd23f;border:2px solid #0f1840}
.wrow{display:flex;align-items:center;gap:10px;background:#16225c;border-radius:12px;padding:14px;margin:8px 0;font-weight:700;color:#fff}.wrow b{margin-left:auto;font-size:20px}.wrow.g b{color:#ffd96a}.wrow.r b{color:#6dff9a}.wrow.on{outline:2px solid #4aa3ff}
#top{position:relative;z-index:8;gap:6px!important;background:#0f1840}
#mid{position:relative;flex:1;display:flex;justify-content:center;gap:6px;min-width:0}
.bal{display:flex;align-items:center;gap:6px;border:0;border-radius:10px;background:#18246b;color:#fff;font-weight:700;padding:0 8px;height:38px;min-width:0;font-size:13px}
.bal b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}.bal .car{font-style:normal;color:#8da0ee;font-size:12px}
.wal{flex:none;border:0;border-radius:10px;background:#3fa84a;color:#fff;font-weight:700;height:38px;padding:0 10px;font-size:13px;box-shadow:0 2px 0 #2c7d35}.wal:active,.bal:active{transform:translateY(1px)}
#balDd{position:fixed;width:230px;background:#16225c;border:1px solid #2a3a8a;border-radius:12px;padding:10px;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#balDd[hidden]{display:none}#balDd .r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 2px;color:#b8c4f5;font-size:14px}#balDd b{color:#fff}
#balDd button{flex:1;border:0;border-radius:8px;background:#233189;color:#fff;font-weight:700;padding:9px;font-size:16px}
#top button.ic{flex:none;width:34px;height:34px;border:0;border-radius:10px;background:#18246b;font-size:17px;line-height:1;padding:0}
.chip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:3px;border:0;border-radius:10px;background:#18246b;padding:5px 8px;font-size:13px;font-weight:700;color:var(--gold)}
.xpbar{width:34px;height:8px;border-radius:5px;background:#14092a;overflow:hidden;display:block}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold));border-radius:5px;transition:width .4s}
#xpf{position:absolute;top:100%;left:12px;z-index:9;font-weight:700;color:var(--cyan);font-size:14px;opacity:0;transition:opacity .3s}
#xpf.on{opacity:1}
#stage{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov{position:fixed;inset:var(--topH,0px) 0 0 0;z-index:5;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
#ov[hidden]{display:none}
.scr{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
h1{font-size:clamp(38px,11vw,56px);line-height:1;margin:6px 0 6px;color:var(--gold);letter-spacing:-.5px}
h2{font-size:26px;margin:0 0 4px;color:var(--gold)}
h3{font-size:17px;margin:20px 0 8px;color:var(--cyan)}
.sub{color:var(--dim);margin:0 0 16px;font-size:16px}
.card{background:var(--card);border-radius:18px;padding:14px}
.lvl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;margin-bottom:14px}
.lvl .lv{font-size:26px;font-weight:700;color:var(--gold)}
.lvl .bar{height:12px;background:#14092a;border-radius:8px;overflow:hidden}
.lvl .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));border-radius:8px}
.lvl small{grid-column:1/3;color:var(--dim);font-size:14px}
.games{display:grid;gap:10px;margin-bottom:14px}
.gcard{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;text-align:left;border:0;background:var(--card);border-radius:18px;padding:12px 14px}
.gcard:active,.btn:active{transform:scale(.98)}
.gcard b{font-size:34px;font-weight:400;text-align:center}
.gcard strong{display:block;font-size:19px}
.gcard em{display:block;font-style:normal;color:var(--dim);font-size:14px;line-height:1.25}
.gcard small{color:var(--cyan);font-size:13px;text-align:right}
.row{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:16px;padding:13px;background:var(--sel);font-weight:700;font-size:16px}
.btn.pri{background:var(--gold);color:#2a1450}
.back{border:0;background:none;color:var(--dim);font-size:16px;padding:4px 0 10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tabs button{flex:none;border:0;border-radius:12px;padding:8px 12px;background:var(--card);color:var(--dim);font-weight:500}
.tabs button.on{background:var(--sel);color:var(--gold)}
.items{display:grid;gap:10px}
.item{display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:12px}
.item.lock{opacity:.6}
.item b{font-size:32px;font-weight:400;text-align:center}
.item strong{display:block;font-size:17px}
.item em{display:block;font-style:normal;color:var(--dim);font-size:13px;line-height:1.25}
.item button{border:0;border-radius:12px;padding:8px 12px;background:var(--gold);color:#2a1450;font-weight:700;font-size:14px}
.item button.on{background:var(--sel);color:var(--cyan)}
.item .tag{color:var(--dim);font-size:13px;text-align:right}
.code{display:flex;gap:8px;margin:6px 0 4px}
.code input{flex:1;min-width:0;border:2px solid var(--sel);background:#14092a;color:var(--ink);border-radius:14px;padding:12px;font:inherit;font-size:16px;-webkit-user-select:text;user-select:text}
.code button{border:0;border-radius:14px;padding:0 16px;background:var(--cyan);color:#10202b;font-weight:700}
#msg{min-height:20px;font-size:14px;color:var(--cyan);margin-bottom:6px}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #2c1d4a}
.seg{display:flex;background:#14092a;border-radius:12px;padding:3px}
.seg button{border:0;background:none;color:var(--dim);padding:6px 10px;border-radius:9px;font-size:14px}
.seg button.on{background:var(--sel);color:var(--gold)}
.tog{width:52px;height:30px;border:0;border-radius:16px;background:#14092a;position:relative}
.tog i{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--dim);transition:.2s}
.tog.on{background:var(--cyan)}
.tog.on i{left:26px;background:#10202b}
.modal{display:flex;min-height:100%;align-items:center;justify-content:center;text-align:center}
.modal .card{width:100%;padding:24px 18px}
.big{font-size:60px;margin:6px 0}
#top button.ic{position:relative}
#top button.ic.has::after{content:"";position:absolute;top:4px;right:4px;width:10px;height:10px;border-radius:50%;background:var(--coral);border:2px solid var(--panel)}
#toast{position:absolute;left:50%;top:72px;transform:translate(-50%,-30px);opacity:0;pointer-events:none;transition:transform .35s,opacity .35s;background:rgba(37,23,64,.94);border:2px solid var(--tc,var(--gold));border-radius:16px;padding:8px 14px;text-align:center;max-width:min(92%,420px);z-index:3;display:flex;flex-direction:column;gap:2px}
#toast.on{transform:translate(-50%,0);opacity:1}
#toast strong{color:var(--tc,var(--gold));font-size:17px}
#toast span{color:var(--ink);font-size:14px}
.mini{display:block;height:6px;border-radius:4px;background:#14092a;overflow:hidden;margin-top:6px}.mini i{display:block;height:100%;border-radius:4px}
.gl{font-size:14px;margin-left:6px}
.new{background:var(--coral);color:#fff;border-radius:8px;font-size:11px;padding:1px 6px;margin-left:6px;vertical-align:middle}
#xpf{display:none!important}
.cash{display:flex;flex-direction:column;align-items:center;border:0;border-radius:12px;background:linear-gradient(#1f6b3a,#0f4a28);box-shadow:inset 0 0 0 2px #d9a400;padding:3px 10px;color:#ffe27a;line-height:1.15}
.cash b{font-size:15px;font-weight:800}.cash small{font-size:9px;letter-spacing:.08em;color:#bff5c9;font-weight:700}
.cash.pop{animation:cpop .35s}@keyframes cpop{50%{transform:scale(1.12)}}
.lb{margin:14px 0 4px;background:var(--panel);border-radius:16px;padding:12px 14px}
.lb h3{margin:0 0 8px;font-size:16px;color:var(--gold)}
.lb>div{display:flex;gap:10px;align-items:center;padding:5px 6px;border-radius:8px;font-size:14px}
.lb>div span{width:20px;color:var(--dim)}.lb>div strong{flex:1}.lb>div em{font-style:normal;color:#7be04a;font-weight:700}
.lb .me{background:rgba(255,210,63,.18)}
.lb p{margin:8px 0 0;font-size:13px;color:var(--dim)}.lb p button{margin-left:8px;border:0;border-radius:10px;background:var(--sel);color:inherit;padding:4px 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#gate{position:absolute;inset:0;z-index:3;background:rgba(18,10,28,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#gate[hidden],#hud[hidden]{display:none}
#gate h2{margin:0}#gate .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:340px}
#gate .chips button{border:0;border-radius:14px;padding:9px 12px;background:var(--sel);font-weight:700;color:var(--ink)}
#gate .chips button.on{background:var(--gold);color:#2a1450}#gate .btn{flex:none;min-width:200px;font-size:22px}
#hud{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:10px;background:rgba(18,10,28,.88);border:2px solid var(--gold);border-radius:18px;padding:6px 8px 6px 14px}
#hud b{font-size:20px;color:var(--gold)}#hud small{display:block;color:var(--cyan);font-size:12px}
#hud button{border:0;border-radius:12px;padding:10px 14px;background:#2fbf71;color:#08210f;font-weight:800;font-size:16px}
#money{position:absolute;left:10px;bottom:10px;z-index:3;border:2px solid var(--gold);border-radius:16px;background:rgba(18,10,28,.88);color:var(--gold);font-weight:700;padding:9px 14px;font-size:15px}
#money[hidden]{display:none}
#bp{position:absolute;inset:0;z-index:5;background:rgba(18,10,28,.85);display:flex;align-items:center;justify-content:center}#bp[hidden]{display:none}#bp h2{text-align:center}
#gate .bet,#bp .bet{display:flex;gap:8px;align-items:center}#gate .bet button,#bp .bet button{border:0;border-radius:12px;background:var(--sel);color:var(--ink);font-weight:800;font-size:20px;width:54px;height:50px}
#gate .bet input,#bp .bet input{width:150px;height:50px;border:2px solid var(--gold);border-radius:12px;background:#14092a;color:var(--gold);font:inherit;font-size:22px;text-align:center;-webkit-user-select:text;user-select:text}
#ov:has(.lob){background:#0b1230}
.lob{padding:0 0 30px;max-width:640px;margin:0 auto}
.lob .lbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#0f1840;position:sticky;top:0;z-index:2}
.lob .brand{font-weight:800;font-size:22px;letter-spacing:-.5px;color:#fff}.lob .brand b{color:#4aa3ff}
.lob .seg2{display:flex;background:#16215a;border-radius:12px;padding:4px;gap:4px}.lob .seg2 button{border:0;border-radius:9px;padding:8px 14px;background:transparent;color:#a9b6e8;font-weight:700}.lob .seg2 button.on{background:#1f7bff;color:#fff}
.lob .hero{padding:22px 16px 6px}.lob .hero h1{font-size:clamp(28px,8vw,40px);color:#fff;line-height:1.08;margin:0 0 14px;font-weight:600;letter-spacing:-.5px}
.lob .gr{display:inline-block;flex:none;background:#2fd35f;color:#052a12;border:0;border-radius:10px;padding:13px 22px;font-weight:800;font-size:17px;box-shadow:0 0 0 4px rgba(255,255,255,.07)}
.lob .bigt{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px}
.lob .bt{position:relative;overflow:hidden;border:0;border-radius:12px;height:132px;color:#fff;text-align:left;padding:0}
.lob .bt .art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:54px;letter-spacing:6px;opacity:.95}
.lob .bt span{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:rgba(14,22,60,.82);font-weight:700;font-size:17px}
.lob .pills{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none}.lob .pills::-webkit-scrollbar,.lob .hrow::-webkit-scrollbar{display:none}
.lob .pills button{flex:none;border:0;border-radius:10px;background:#131d4d;color:#c5d0ff;padding:10px 14px;font-weight:600}.lob .pills button.on{background:#1b2a6f;color:#fff}
.lob .sec{display:flex;align-items:baseline;gap:10px;margin:18px 16px 10px;color:#fff;font-size:20px;font-weight:600}.lob .sec small{color:#7f90d6;font-size:13px}
.lob .hrow{scroll-padding-left:16px;display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.lob .tile{position:relative;flex:none;width:118px;height:152px;border:0;border-radius:10px;overflow:hidden;color:#fff;padding:0;scroll-snap-align:start;transition:transform .12s,box-shadow .12s}
.lob .tile:active{transform:scale(.95);box-shadow:0 0 0 3px #4aa3ff}
.lob .tile .ic2{position:absolute;inset:0 0 38px 0;display:flex;align-items:center;justify-content:center;font-size:52px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.lob .tile .nm{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-weight:800;font-size:15px;line-height:1;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.lob .tile .st{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:9px;font-weight:700;letter-spacing:.5px;opacity:.85}
.lob .tile .bd{position:absolute;top:6px;right:6px;background:#0c1330;border-radius:6px;padding:3px 6px;font-size:8.5px;font-weight:800;letter-spacing:.4px}
.lob .tile.lock{background:#10183a;color:#6d7bb5}.lob .tile.lock .nm{text-shadow:none}
.lob .lw{flex:none;width:74px;text-align:center;font-size:11px;color:#9fb0ee}.lob .lw .bx{height:84px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:5px}.lob .lw b{display:block;color:#2fd35f;font-size:12px;margin-top:2px}
.lob .lwl{flex:none;width:74px;height:84px;border-radius:9px;background:#18246b;color:#fff;font-size:11px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-weight:600}
.lob .menu{margin:18px 16px 0;background:#101a43;border-radius:12px;overflow:hidden}.lob .menu button{display:flex;gap:12px;align-items:center;width:100%;border:0;background:transparent;color:#d6defc;padding:14px;font-weight:600;font-size:16px;border-bottom:1px solid #1b2760;text-align:left}
.lob .menu button:last-child{border-bottom:0}
.lob .lbw{margin:16px}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button class="chip" id="chip" aria-label="Open menu"><span id="lv">Lv 1</span><span class="xpbar"><i id="xpfill"></i></span></button>
    <span id="xpf"></span>
    <div id="mid"><button class="bal" id="cash" aria-label="Balance and bet"><i class="cn g" id="cn">G</i><b id="cashv">0.00</b><i class="car">&#9662;</i></button><button class="wal" id="wallet">Wallet</button>
      <div id="balDd" hidden><div class="r w" data-w="play"><span><i class="cn g">G</i> Play money</span><b id="ddPlay"></b></div><div class="r w" data-w="real"><span><i class="cn r">$</i> Real money</span><b id="ddReal"></b></div></div></div>
    <button class="ic" id="bMute" aria-label="Mute">&#128266;</button>
    <button class="ic" id="bColl" aria-label="Collection">&#127873;</button>
    <button class="ic" id="bSet" aria-label="Settings">&#9881;&#65039;</button>
  </header>
  <div id="stage"><canvas id="c"></canvas><div id="toast" role="status" aria-live="polite"></div><div id="gate" hidden></div><button id="money" hidden>💵 Bet &amp; play for money</button><div id="hud" hidden><span><b id="hm">x1.00</b><small id="hv"></small></span><button id="hc">CASH OUT</button></div>
  </div>
</div>
<div id="ov" hidden></div>
<script>
(() => {
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, cur = null, paused = false, camOn = false;
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FONT = 'Fredoka, ui-rounded, system-ui, sans-serif';
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');

/* =====================================================
   SAVE DATA, SETTINGS, ITEMS, XP
   ===================================================== */
const TG = (k, label, def = true) => ({ k, label, t: 'tog', def }), CH = (k, label, opts, def = 0) => ({ k, label, t: 'ch', opts, def });
const SPEC = [
  { g: 'all', title: 'General', items: [
    { k: 'sound', label: 'Sound', t: 'tog', def: true },
    { k: 'vol', label: 'Volume', t: 'vol', def: 80 },
    { k: 'music', label: 'Slot music', t: 'tog', def: true },
    { k: 'vibe', label: 'Vibration', t: 'tog', def: true }] },
  { g: 'slots', items: [TG('turbo', 'Start in turbo spin', false), TG('shake', 'Screen shake on big wins')] },
  { g: 'sevens', items: [TG('quick', 'Quick spin', false), TG('shake', 'Screen shake on big wins')] },
  { g: 'pharaoh', items: [TG('quick', 'Quick spin', false), TG('lines', 'Show winning lines'), TG('shake', 'Screen shake on big wins')] },
  { g: 'deepsea', items: [TG('quick', 'Quick spin', false), TG('shake', 'Screen shake on big wins')] },
  { g: 'dragon', items: [TG('quick', 'Quick spin', false), CH('rspeed', 'Hold & Win respin speed', ['Slow', 'Normal', 'Fast'], 1), TG('shake', 'Screen shake on big wins')] },
  { g: 'bj', items: [CH('decks', 'Decks in shoe', ['1', '2', '6', '8'], 2), CH('h17', 'Dealer on soft 17', ['Stands', 'Hits']), CH('pay', 'Blackjack pays', ['3:2', '6:5'])] },
  { g: 'mines', items: [CH('cnt', 'Mines', ['1', '3', '5', '10'], 1), TG('reveal', 'Show all mines after a round')] },
  { g: 'dice', items: [CH('dir', 'Default roll', ['Over', 'Under']), TG('fast', 'Fast roll', false)] },
  { g: 'plinko', items: [CH('rows', 'Rows', ['8', '12', '16'], 1), CH('risk', 'Risk', ['Low', 'Medium', 'High'], 1), CH('speed', 'Ball speed', ['Slow', 'Normal', 'Fast'], 1)] },
  { g: 'limbo', items: [CH('speed', 'Reveal speed', ['Slow', 'Fast'])] },
  { g: 'hilo', items: [CH('ace', 'Ace is', ['Low', 'High']), TG('skip', 'Allow skipping cards')] },
  { g: 'keno', items: [CH('speed', 'Draw speed', ['Slow', 'Fast']), TG('clear', 'Clear picks after each round', false)] },

        if (!stopped) { const kk = Math.floor(tm * 18), f = (tm * 18) % 1; ctx.globalAlpha = .75; sCell(x, y + (f - .5) * cw * .5, cw, GS[(kk + r * 3 + c * 5) % 5]); ctx.globalAlpha = 1; continue; }
        if (k.coin) {
          const s = 1 + (k.fresh || 0) * .25; ctx.save(); ctx.translate(x + cw / 2, y + cw / 2); ctx.scale(s, s); ctx.fillStyle = '#3a1a05'; rr(-cw / 2 + 2, -cw / 2 + 2, cw - 4, cw - 4, cw * .14); ctx.fill();
          const gr = ctx.createRadialGradient(-cw * .1, -cw * .12, cw * .05, 0, 0, cw * .4); gr.addColorStop(0, '#fff6b0'); gr.addColorStop(1, hw ? '#e09a00' : '#b8860b'); ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, cw * .38, 0, TAU); ctx.fill(); ctx.strokeStyle = '#fff3a0'; ctx.lineWidth = 3; ctx.stroke();
          text('x' + k.v, 0, 1, cw * (String(k.v).length > 3 ? .2 : .26), '#4a2a00'); ctx.restore();
        } else sCell(x, y, cw, GS[k.gem], { hot: st === 'win' && hot.has(i) && Math.floor(tm * 5) % 2 === 0 });
      }
      ctx.restore();
    }
    ctx.restore();
    const iy = gy + cw * R + 26; if (msg) text(msg, W / 2, iy, Math.min(20, W * .055), win > 0 ? '#7be04a' : '#ffd23f');
    if (hw) text(`Locked ${coins()}/15   Total ${money(sum() * bet)}`, W / 2, iy + 26, 14, '#fff6a0'); else text('6+ coins: Hold & Win. Fill all 15 for the GRAND jackpot', W / 2, iy + 26, 12, 'rgba(255,255,255,.65)');
    const idle = st === 'idle'; betBar(btns, H - 112, idle); const bw = Math.min(W - 24, 340), x = (W - bw) / 2;
    cbtn(btns, 'spin', 'SPIN', x, H - 60, bw * .66, 50, '#2fbf71', idle, 24); cbtn(btns, 'auto', auto ? 'STOP' : 'AUTO', x + bw * .68, H - 60, bw * .32, 50, auto ? '#e0483d' : '#3a8bff', true, 16);
    pt.draw();
  }
  function down(x, y) { const b = hitBtn(btns, x, y); if (!b) return; snd('pop', 1); if (b.id === 'spin') spin(); else if (b.id === 'auto') { auto = !auto; if (auto && st === 'idle') spin(); } else if (st === 'idle') betAct(b.id); }
  return { reset, update, draw, down, key(e) { if (e.key === ' ' || e.key === 'Enter') spin(); } };
}

const ENGINE = { slots: Slots, sevens: Reels('sevens'), pharaoh: Reels('pharaoh'), deepsea: Reels('deepsea'), dragon: Dragon(), bj: BJ, mines: Mines, dice: Dice, plinko: Plinko, limbo: Limbo, hilo: HiLo, keno: Keno, tower: Tower, wheel: Wheel, chicken: Chicken, rps: RPS, war: War };
const ov = $('ov');
let from = 'menu', dirty = false, collG = 'slots', msg = '', curIdx = 0;
function openOv(h) { ov.innerHTML = h; ov.hidden = false; paused = true; syncGate(); ov.scrollTop = 0; }
function closeOv() { ov.hidden = true; ov.innerHTML = ''; paused = camOn; syncGate(); syncNav(); if (dirty) { dirty = false; cur.reset(); } }
function bestText(g) {
  const b = best.get(g.id);
  return b ? (g.id === 'pop' ? `Best ${b} shots` : g.id === 'knife' ? `Best stage ${b}` : `Best ${b}`) : 'New';
}
function logWin(gid, amt) { if (!amt || amt <= 0 || demo && OWN.includes(gid)) return; save.wins = save.wins || []; save.wins.unshift({ g: gid, a: Math.round(amt) }); save.wins.length = Math.min(save.wins.length, 14); }
const TILE = {}; CAS.forEach(c => { TILE[c.id] = [c.grad, c.kind === 'slot' ? 'EXCLUSIVE' : 'ORIGINAL']; });
function showMenu() {
  from = 'menu'; const gi = id => GAMES.findIndex(g => g.id === id), G = id => GAMES[gi(id)];
  const tile = id => { const g = G(id), t = TILE[id]; return `<button class="tile" data-act="play" data-i="${gi(id)}" style="background:${t[0]}"><span class="bd">${t[1]}</span><span class="ic2">${g.icon}</span><span class="nm">${g.name}</span><span class="st">POCKET STUDIOS</span></button>`; };
  const wins = (save.wins || []).map(w => `<div class="lw"><div class="bx" style="background:${TILE[w.g][0]}">${G(w.g).icon}</div>You<b>${money(w.a)}</b></div>`).join('') || '<div class="lw" style="width:220px;text-align:left;padding-top:20px">Your real wins show up here.</div>';
  const rec = (save.recent || []).filter(id => G(id)).map(tile).join('');
  openOv(`<div class="scr lob"><div class="lbar"><div class="brand">POCKET<b>BET</b></div><div class="seg2"><button class="on">Casino</button></div></div>
    <div class="hero"><h1>Experience Betting<br>Without Boundaries</h1><button class="gr" data-act="play" data-i="0">Play now ➜</button></div>
    <div class="bigt"><button class="bt" data-act="play" data-i="0" style="background:linear-gradient(150deg,#3b6cff,#12206b)"><div class="art">🍭🍇🍒</div><span>Slots ➜</span></button><button class="bt" data-act="play" data-i="${gi('bj')}" style="background:linear-gradient(150deg,#14a75d,#063d25)"><div class="art">🃏♠️♦️</div><span>Table games ➜</span></button></div>
    <div class="pills"><button class="on" data-go="top">🏠 Home</button><button data-go="rec">🕘 Recently played</button><button data-go="sl">🎰 Slots</button><button data-go="orig">🎮 Originals</button></div>
    <div class="sec">Live Wins <small>🟢 yours only</small></div><div class="hrow"><div class="lwl">Live Wins</div>${wins}</div>
    ${rec ? `<div class="sec" id="rec">Recently Played</div><div class="hrow">${rec}</div>` : '<div id="rec"></div>'}
    <div class="sec" id="sl">Slots <small>${CAS.filter(c => c.kind === 'slot').length} games</small></div><div class="hrow">${CAS.filter(c => c.kind === 'slot').map(c => tile(c.id)).join('')}</div>
    <div class="sec" id="orig">Originals <small>${CAS.filter(c => c.kind === 'orig').length} games</small></div><div class="hrow">${CAS.filter(c => c.kind === 'orig').map(c => tile(c.id)).join('')}</div>
    <div class="lbw">${lbHtml()}</div>
    <div class="menu"><button data-act="coll">🎁 Collection &amp; rewards</button><button data-act="set">⚙️ Settings, sound &amp; music</button></div></div>`);
  syncNav();
}
document.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (!b) return; const t = b.dataset.go === 'top' ? ov : document.getElementById(b.dataset.go); if (b.dataset.go === 'top') ov.scrollTo({ top: 0, behavior: 'smooth' }); else if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
function showColl() {
  const eq = eqItem(collG).id;
  openOv(`<div class="scr"><button class="back" data-act="back">\u2190 Back</button><h2>Collection</h2>
    <p class="sub">Looks only, every one plays the same. Level up to unlock more, or type a name to unlock one now.</p>
    <div class="code"><input id="code" placeholder="Type an item name" autocomplete="off" autocapitalize="off" spellcheck="false"><button data-act="code">Unlock</button></div>
    <div id="msg">${msg}</div>
    <div class="tabs">${GAMES.map(g => `<button class="${g.id === collG ? 'on' : ''}" data-act="ctab" data-g="${g.id}">${g.icon} ${g.name}${ITEMS[g.id].some(isNew) ? ' \u2022' : ''}</button>`).join('')}</div>
    <p class="sub" style="margin:4px 0 10px">${GAMES.find(x => x.id === collG).name} Lv ${level(collG)}. Level up this game to unlock its looks.</p>
    <div class="items">${ITEMS[collG].map(i => {
      const u = unlocked(i), on = i.id === eq;
      return `<div class="item ${u ? '' : 'lock'}"><b>${u ? i.icon : '\uD83D\uDD12'}</b><span><strong>${i.name}${isNew(i) ? '<span class="new">NEW</span>' : ''}</strong><em>${i.desc}</em></span>${u ? `<button class="${on ? 'on' : ''}" data-act="equip" data-g="${collG}" data-id="${i.id}">${on ? 'Equipped' : 'Equip'}</button>` : `<span class="tag">Unlocks at<br>Lv ${i.lvl}</span>`}</div>`;
    }).join('')}</div></div>`);
  markSeen(collG);
}
let setG = 'slots';
function showSet() {
  const gm = GAMES.find(x => x.id === setG) || GAMES[0], gs = SPEC.filter(s => s.g === 'all' || s.g === gm.id);
  openOv(`<div class="scr"><button class="back" data-act="back">\u2190 Back</button><h2>Settings</h2><p class="sub">Every game has its own settings. Pick a game below. Changes restart the round.</p>
    <div class="tabs">${GAMES.map(g => `<button class="${g.id === gm.id ? 'on' : ''}" data-act="stab" data-g="${g.id}">${g.icon} ${g.name}</button>`).join('')}</div>
    ${gs.map(s => `<h3>${s.g === 'all' ? 'General' : gm.name}</h3>${s.items.map(i => {
      const v = opt(s.g, i.k);
      return `<div class="set"><span>${i.label}</span>${i.t === 'vol' ? `<input type="range" min="0" max="100" value="${v}" data-vol="1" style="flex:1;max-width:200px;accent-color:#ffd23f">` : i.t === 'tog'
        ? `<button class="tog ${v ? 'on' : ''}" data-act="tog" data-g="${s.g}" data-k="${i.k}" aria-pressed="${!!v}"><i></i></button>`
        : `<span class="seg">${i.opts.map((o, n) => `<button class="${n === v ? 'on' : ''}" data-act="ch" data-g="${s.g}" data-k="${i.k}" data-v="${n}">${o}</button>`).join('')}</span>`}</div>`;
    }).join('')}`).join('')}
    <h3>Progress</h3><div class="set"><span>Reset all XP, codes and bests</span><button class="btn" style="flex:none;padding:8px 14px" data-act="wipe">Reset</button></div></div>`);
}
function setOpt(g, k, v) { save.gs[g] = save.gs[g] || {}; save.gs[g][k] = v; persist(); dirty = true; }
function tryCode() {
  const v = norm($('code').value); if (!v) return;
  let found = null;
  if (v === 'unlockall') { save.codes = ['*']; persist(); msg = 'Everything unlocked.'; return showColl(); }
  GAMES.forEach(g => ITEMS[g.id].forEach(i => { if (norm(i.name) === v || norm(i.id) === v) found = [g, i]; }));
  if (!found) { msg = 'No item with that name. Check the spelling.'; return showColl(); }
  const [g, i] = found;
  if (unlocked(i)) msg = `${i.name} is already unlocked.`;
  else { save.codes.push(i.id); if (!save.seen.includes(i.id)) save.seen.push(i.id); msg = `Unlocked ${i.name}!`; snd('unlock'); vib(20); }
  save.equip[g.id] = i.id; persist(); dirty = true; collG = g.id; showColl();
}
ov.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act; vib(6);
  if (a === 'play') select(+b.dataset.i);
  else if (a === 'name') { const n = (prompt('Your name on the leaderboard', save.name) || '').trim().slice(0, 14); if (n) { save.name = n; persist(); } showMenu(); }
  else if (a === 'coll') { msg = ''; showColl(); }
  else if (a === 'set') { setG = curG(); showSet(); }
  else if (a === 'stab') { setG = b.dataset.g; showSet(); }
  else if (a === 'claim') { if (claimLeft() === 0) { save.play += CLAIM_AMT; save.claimAt = Date.now(); persist(); renderCash(); ching(3); vib([20, 30, 20]); } showWallet(); }
  else if (a === 'wsel') { if (rs === 'live') return; save.mode = b.dataset.w; setBet(save.bet); persist(); renderCash(); showWallet(); }
  else if (a === 'back') { from === 'menu' ? showMenu() : closeOv(); }
  else if (a === 'close') closeOv();
  else if (a === 'ctab') { collG = b.dataset.g; showColl(); }
  else if (a === 'equip') {
    save.equip[b.dataset.g] = b.dataset.id; persist(); dirty = true; collG = b.dataset.g;
    if (b.dataset.back) closeOv(); else { msg = ''; showColl(); }
  }
  else if (a === 'code') tryCode();
  else if (a === 'tog') { setOpt(b.dataset.g, b.dataset.k, !opt(b.dataset.g, b.dataset.k)); muteIcon(); showSet(); }
  else if (a === 'ch') { setOpt(b.dataset.g, b.dataset.k, +b.dataset.v); showSet(); }
  else if (a === 'wipe') { if (confirm('Reset your money, all XP, unlock codes, equipped gear and best scores?')) { try { localStorage.clear(); } catch (_) {} save = { xp: {}, codes: [], equip: {}, gs: {}, seen: null, real: 1000, play: 5000, mode: 'play', bet: 50, name: 'You', bigWin: 0 }; wire(); rs = 'idle'; initSeen(); updateTop(); dirty = true; showMenu(); } }
});
ov.addEventListener('input', e => { if (e.target.dataset.vol) { save.gs.all = save.gs.all || {}; save.gs.all.vol = +e.target.value; persist(); if (master) master.gain.value = e.target.value / 100; } });
ov.addEventListener('change', e => { if (e.target.dataset.vol) ching(1); });
ov.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'code') tryCode(); });
const muteIcon = () => { $('bMute').innerHTML = opt('all', 'sound') === false ? '&#128263;' : '&#128266;'; };
$('bMute').addEventListener('click', () => { save.gs.all = save.gs.all || {}; save.gs.all.sound = opt('all', 'sound') === false; persist(); muteIcon(); if (!ov.hidden && /Settings/.test(ov.innerHTML)) showSet(); });
muteIcon();
$('chip').addEventListener('click', showMenu);
$('bColl').addEventListener('click', () => { if (ov.hidden) collG = curG(); from = ov.hidden ? 'game' : from; msg = ''; showColl(); });
$('bSet').addEventListener('click', () => { from = ov.hidden ? 'game' : from; setG = curG(); showSet(); });

/* ---------- input, main loop ---------- */
function syncNav() {}
function select(i) { save.recent = [GAMES[i].id].concat((save.recent || []).filter(x => x !== GAMES[i].id)).slice(0, 6); if (rs === 'live') settleRound(); rs = 'idle'; curIdx = i; cur = ENGINE[GAMES[i].id]; dirty = false; cur.reset(); ov.hidden = true; ov.innerHTML = ''; paused = false; syncNav(); updateTop(); syncGate(); }
function resize() {
  document.documentElement.style.setProperty('--topH', $('top').offsetHeight + 'px');
  const r = cv.parentElement.getBoundingClientRect(), ow = W, oh = H;
  DPR = Math.min(window.devicePixelRatio || 1, 2); W = r.width; H = r.height;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (cur && (Math.abs(W - ow) > 80 || Math.abs(H - oh) > 160)) cur.reset();
}
const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
cv.addEventListener('pointerdown', e => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) {} const p = pos(e); cur.down && cur.down(p.x, p.y); });
cv.addEventListener('pointermove', e => { const p = pos(e); cur.move && cur.move(p.x, p.y); });
cv.addEventListener('pointerup', e => { const p = pos(e); cur.up && cur.up(p.x, p.y); });
cv.addEventListener('pointercancel', () => { cur.up && cur.up(); });
window.addEventListener('keydown', e => {
  if (paused || e.target.tagName === 'INPUT') return;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  const n = parseInt(e.key, 10); if (n >= 1 && n <= GAMES.length) { select(n - 1); return; }
  cur.key && cur.key(e);
});
window.addEventListener('resize', resize);
Object.values(ENGINE).forEach(E => { const r = E.reset; E.reset = () => { if (rs !== 'live') rs = 'idle'; r(); syncGate(); }; });
updateTop(); resize();
cur = Slots; cur.reset(); showMenu();
let last = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  if (!paused) cur.update(dt); cur.draw();

}
