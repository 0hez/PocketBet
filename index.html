<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chat</title>
<style>
:root{color-scheme:dark;--bg:#0e0e10;--fg:#efeff1;--p:#9147ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;height:100dvh;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
header,form{display:flex;gap:6px;padding:8px}
form{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
input{flex:1;min-width:0;background:#18181b;color:var(--fg);border:1px solid #333;border-radius:8px;padding:10px;font-size:16px}
button{background:var(--p);color:#fff;border:0;border-radius:8px;padding:0 14px;font-size:15px;min-height:40px}
#tabs{display:flex;overflow-x:auto;gap:4px;padding:0 8px 6px;flex:none}
#tabs button{background:#26262c;white-space:nowrap;min-height:34px;padding:0 12px}
#tabs .on{background:var(--p)}
#tabs .new{outline:2px solid var(--p)}
#chat{flex:1;min-height:0;display:flex;flex-direction:column}
.log{flex:1;overflow-y:auto;padding:6px 10px;display:none;overscroll-behavior:contain}
.log.on{display:block}
.m{padding:2px 0;word-break:break-word}
.m.h{opacity:.6}
.b{height:18px;width:18px;vertical-align:middle;margin-right:3px}
.e{height:28px;vertical-align:middle;margin:0 1px}
.act{font-style:italic}
dialog{background:#18181b;color:var(--fg);border:1px solid #333;border-radius:12px;width:min(90vw,380px)}
dialog input{width:100%;margin:6px 0}
</style>
</head>
<body>
<header>
  <input id="ch" placeholder="Add channel" autocapitalize="none" autocomplete="off">
  <button id="join">Join</button>
  <button id="cog" aria-label="Login">⚙</button>
</header>
<div id="tabs"></div>
<div id="chat"></div>
<form id="f">
  <input id="in" placeholder="Send a message" autocomplete="off">
  <button>Send</button>
</form>
<dialog id="dlg">
  <div>
    <b id="who">Login</b>
    <input id="cid" placeholder="Twitch Client ID (one-time)" autocapitalize="none" autocomplete="off">
    <button id="login" style="width:100%">Login with Twitch</button>
    <button id="logout" style="width:100%;background:#26262c;margin-top:6px">Log out</button>
    <button id="close" style="width:100%;background:#26262c;margin-top:6px">Close</button>
  </div>
</dialog>
<script>
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};
const G = { badges: {}, ffz: {}, emotes: {} };
const chans = {};
let cur = null, ws = null, auth = store.get('auth', {});

const fix = u => u.startsWith('//') ? 'https:' + u : u;
const j = async u => { try { const r = await fetch(u); return r.ok ? await r.json() : null } catch { return null } };
const hsl = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h} 60% 65%)` };
const badges = (d, o) => { for (const [s, v] of Object.entries(d?.badge_sets || {})) for (const [k, x] of Object.entries(v.versions)) o[s + '/' + k] = x.image_url_2x || x.image_url_1x };
const seven = (l, o) => { for (const e of l || []) { const h = e.data?.host?.url; if (h) o[e.name] = fix(h) + '/2x.webp' } };
const bttv = (l, o) => { for (const e of l || []) o[e.code] = `https://cdn.betterttv.net/emote/${e.id}/2x.webp` };

// ---------- globals: Twitch badges, FFZ badges, 7TV/BTTV emotes ----------
const globalsReady = (async () => {
  const [tb, ffz, s, b] = await Promise.all([
    j('https://badges.twitch.tv/v1/badges/global/display'),
    j('https://api.frankerfacez.com/v1/badges/ids'),
    j('https://7tv.io/v3/emote-sets/global'),
    j('https://api.betterttv.net/3/cached/emotes/global')
  ]);
  badges(tb, G.badges);
  seven(s?.emotes, G.emotes);
  bttv(b, G.emotes);
  if (ffz) for (const x of ffz.badges) {
    const img = fix(x.urls['2'] || x.urls['1']);
    for (const u of ffz.users[x.id] || []) G.ffz[u] = img;
  }
})();

// ---------- IRC ----------
function parse(raw) {
  let s = raw.trim(); if (!s) return null;
  const tags = {};
  if (s[0] == '@') {
    const i = s.indexOf(' ');
    for (const kv of s.slice(1, i).split(';')) { const e = kv.indexOf('='); if (e > 0) tags[kv.slice(0, e)] = kv.slice(e + 1) }
    s = s.slice(i + 1);
  }
  let prefix = '';
  if (s[0] == ':') { const i = s.indexOf(' '); prefix = s.slice(1, i); s = s.slice(i + 1) }
  let trailing = null;
  const t = s.indexOf(' :'); if (t >= 0) { trailing = s.slice(t + 2); s = s.slice(0, t) }
  const p = s.split(' ').filter(Boolean);
  return { tags, prefix, cmd: p[0], params: p.slice(1), trailing, nick: prefix.split('!')[0] };
}

function connect() {
  ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  ws.onopen = () => {
    const can = auth.u && auth.t;
    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    ws.send('PASS ' + (can ? (auth.t.startsWith('oauth:') ? auth.t : 'oauth:' + auth.t) : 'SCHMOOPIIE'));
    ws.send('NICK ' + (can ? auth.u.toLowerCase() : 'justinfan' + (10000 + Math.random() * 80000 | 0)));
    for (const n in chans) ws.send('JOIN #' + n);
  };
  ws.onmessage = e => {
    for (const l of e.data.split('\r\n')) {
      if (l.startsWith('PING')) { ws.send('PONG :tmi.twitch.tv'); continue }
      const m = parse(l); if (m) onIrc(m);
    }
  };
  ws.onclose = () => setTimeout(connect, 3000);
}
function reconnect() { if (ws) { ws.onclose = null; ws.close() } connect() }

function onIrc(m) {
  if (m.cmd == 'NOTICE' && /authentication failed|improperly formatted auth/i.test(m.trailing || '')) {
    auth = {}; store.set('auth', auth); reconnect();
    alert('Twitch login expired. Tap ⚙ to log in again.'); return;
  }
  const c = chans[(m.params[0] || '').replace('#', '')];
  if (!c) return;
  if (m.cmd == 'PRIVMSG') push(c, mkMsg(m, c));
  else if (m.cmd == 'ROOMSTATE' && !c.room && m.tags['room-id']) load(c, m.tags['room-id']);
}

// ---------- message rendering ----------
function mkMsg(m, c, hist) {
  let text = m.trailing || '', action = false;
  if (text.startsWith('\x01ACTION ')) { action = true; text = text.slice(8).replace(/\x01/g, '') }
  const d = document.createElement('div');
  d.className = 'm' + (hist ? ' h' : '');
  const img = (url, cls, parent) => { const i = new Image(); i.src = url; i.className = cls; i.loading = 'lazy'; i.onerror = () => i.remove(); parent.append(i) };

  for (const b of (m.tags.badges || '').split(',')) { const u = c.badges[b] || G.badges[b]; if (u) img(u, 'b', d) }
  const f = G.ffz[m.tags['user-id']]; if (f) img(f, 'b', d);

  const name = m.tags['display-name'] || m.nick;
  const color = m.tags.color || hsl(name);
  const n = document.createElement('b'); n.textContent = name; n.style.color = color;
  d.append(n, action ? ' ' : ': ');

  const root = action ? Object.assign(document.createElement('span'), { className: 'act' }) : d;
  if (action) { root.style.color = color; d.append(root) }

  const native = {};
  for (const e of (m.tags.emotes || '').split('/')) {
    if (!e) continue;
    const [id, r] = e.split(':');
    for (const x of r.split(',')) { const [a, b] = x.split('-'); native[+a] = [+b, id] }
  }
  let buf = '';
  const flush = () => {
    if (!buf) return;
    const w = buf.split(' ');
    w.forEach((word, i) => {
      const sp = i < w.length - 1 ? ' ' : '';
      const u = c.emotes[word] || G.emotes[word];
      if (u) { img(u, 'e', root); root.append(sp) } else root.append(word + sp);
    });
    buf = '';
  };
  const rs = [...text];
  for (let i = 0; i < rs.length; i++) {
    const n2 = native[i];
    if (n2) { flush(); img(`https://static-cdn.jtvnw.net/emoticons/v2/${n2[1]}/default/dark/2.0`, 'e', root); i = n2[0]; continue }
    buf += rs[i];
  }
  flush();
  return d;
}

function push(c, el) {
  const atBottom = c.el.scrollHeight - c.el.scrollTop - c.el.clientHeight < 80;
  c.el.append(el);
  while (c.el.children.length > 500) c.el.firstChild.remove();
  if (atBottom) c.el.scrollTop = c.el.scrollHeight;
  if (cur != c.name) { c.unread = true; tabs() }
}

// ---------- per-channel assets + chat history ----------
async function load(c, room) {
  c.room = room;
  await globalsReady;
  const [bd, s, b, f, h] = await Promise.all([
    j(`https://badges.twitch.tv/v1/badges/channels/${room}/display`),
    j(`https://7tv.io/v3/users/twitch/${room}`),
    j(`https://api.betterttv.net/3/cached/users/twitch/${room}`),
    j(`https://api.frankerfacez.com/v1/room/id/${room}`),
    j(`https://recent-messages.robotty.de/api/v2/recent-messages/${c.name}?limit=100`)
  ]);
  badges(bd, c.badges);
  seven(s?.emote_set?.emotes, c.emotes);
  if (b) { bttv(b.channelEmotes, c.emotes); bttv(b.sharedEmotes, c.emotes) }
  for (const set of Object.values(f?.sets || {})) for (const e of set.emoticons || []) c.emotes[e.name] = fix(e.urls['2'] || e.urls['1']);
  const frag = document.createDocumentFragment();
  for (const l of h?.messages || []) { const m = parse(l); if (m && m.cmd == 'PRIVMSG') frag.append(mkMsg(m, c, true)) }
  c.el.prepend(frag);
  if (cur == c.name) c.el.scrollTop = c.el.scrollHeight;
}

// ---------- tabs ----------
function tabs() {
  const t = $('#tabs'); t.innerHTML = '';
  for (const n in chans) {
    const b = document.createElement('button');
    b.textContent = n + (n == cur ? ' ✕' : '');
    b.className = (n == cur ? 'on ' : '') + (chans[n].unread ? 'new' : '');
    b.onclick = () => n == cur ? close(n) : show(n);
    t.append(b);
  }
}
function show(n) {
  cur = n; chans[n].unread = false;
  for (const k in chans) chans[k].el.classList.toggle('on', k == n);
  tabs(); chans[n].el.scrollTop = chans[n].el.scrollHeight;
}
function close(n) {
  if (ws && ws.readyState == 1) ws.send('PART #' + n);
  chans[n].el.remove(); delete chans[n];
  store.set('chs', Object.keys(chans));
  const rest = Object.keys(chans);
  if (rest.length) show(rest[0]); else { cur = null; tabs() }
}
function open(name) {
  name = name.trim().toLowerCase().replace('#', ''); if (!name) return;
  if (!chans[name]) {
    const el = document.createElement('div'); el.className = 'log';
    $('#chat').append(el);
    chans[name] = { name, el, badges: {}, emotes: {}, room: null };
    store.set('chs', Object.keys(chans));
    if (ws && ws.readyState == 1) ws.send('JOIN #' + name);
  }
  show(name);
}

// ---------- UI ----------
$('#join').onclick = () => { open($('#ch').value); $('#ch').value = '' };
$('#ch').onkeydown = e => { if (e.key == 'Enter') $('#join').click() };
const CLIENT_ID = ''; // optional: paste your Twitch Client ID here to skip the prompt
$('#cog').onclick = () => {
  const on = !!(auth.u && auth.t);
  $('#who').textContent = on ? 'Logged in as ' + auth.u : 'Login';
  $('#login').style.display = on ? 'none' : '';
  $('#logout').style.display = on ? '' : 'none';
  $('#cid').style.display = (on || CLIENT_ID) ? 'none' : '';
  $('#cid').value = store.get('cid', '');
  $('#dlg').showModal();
};
$('#close').onclick = () => $('#dlg').close();
$('#logout').onclick = () => { auth = {}; store.set('auth', auth); $('#dlg').close(); reconnect(); };
$('#login').onclick = () => {
  const cid = CLIENT_ID || $('#cid').value.trim();
  if (!cid) { $('#cid').focus(); return }
  store.set('cid', cid);
  const state = Math.random().toString(36).slice(2);
  store.set('state', state);
  location.href = 'https://id.twitch.tv/oauth2/authorize?' + new URLSearchParams({
    client_id: cid, redirect_uri: location.origin + location.pathname,
    response_type: 'token', scope: 'chat:read chat:edit', state
  });
};
async function validate(tok) {
  try {
    const r = await fetch('https://id.twitch.tv/oauth2/validate', { headers: { Authorization: 'OAuth ' + tok } });
    return r.ok ? await r.json() : null;
  } catch { return undefined } // network error: keep the token
}
async function finishLogin() {
  const h = new URLSearchParams(location.hash.slice(1));
  const tok = h.get('access_token');
  if (tok) {
    const ok = h.get('state') == store.get('state');
    history.replaceState(null, '', location.pathname + location.search);
    const v = ok && await validate(tok);
    if (v) { auth = { u: v.login, t: tok, id: v.user_id }; store.set('auth', auth) }
  } else if (auth.t) {
    if (await validate(auth.t) === null) { auth = {}; store.set('auth', auth) }
  }
}
$('#f').onsubmit = e => {
  e.preventDefault();
  const text = $('#in').value.trim(); if (!text || !cur) return;
  if (!(auth.u && auth.t)) { $('#cog').click(); return }
  ws.send(`PRIVMSG #${cur} :${text}`);
  push(chans[cur], mkMsg({ tags: { 'display-name': auth.u }, trailing: text, nick: auth.u }, chans[cur]));
  $('#in').value = '';
};

finishLogin().then(() => {
  for (const n of store.get('chs', [])) open(n);
  connect();
});
</script>
</body>
</html>
