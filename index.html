<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#120a1c">
<title>Pocket Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120a1c;--panel:#1d1230;--card:#251740;--sel:#32205a;--ink:#fff6e5;--dim:#9a8bb5;--gold:#ffd23f;--cyan:#3ee0cf;--coral:#ff5d73}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Fredoka,ui-rounded,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;background:var(--panel)}
#top .sp{flex:1}
#top button.ic{width:38px;height:38px;border:0;border-radius:12px;background:var(--sel);font-size:19px;line-height:1}
.chip{display:flex;align-items:center;gap:8px;border:0;border-radius:12px;background:var(--sel);padding:7px 10px;font-weight:700;color:var(--gold)}
.xpbar{width:70px;height:8px;border-radius:5px;background:#14092a;overflow:hidden;display:block}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold));border-radius:5px;transition:width .4s}
#xpf{font-weight:700;color:var(--cyan);font-size:14px;opacity:0;transition:opacity .3s}
#xpf.on{opacity:1}
#stage{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
nav{display:flex;gap:4px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--panel)}
nav button{flex:1;min-width:0;border:0;border-radius:14px;padding:6px 0 5px;background:transparent;color:var(--dim);font-weight:500;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;white-space:nowrap}
nav button b{font-size:21px;line-height:1.1;font-weight:400}
nav button[aria-selected=true]{background:var(--sel);color:var(--gold)}
#ov{position:fixed;inset:0;z-index:5;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
#ov[hidden]{display:none}
.scr{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
h1{font-size:clamp(38px,11vw,56px);line-height:1;margin:6px 0 6px;color:var(--gold);letter-spacing:-.5px}
h2{font-size:26px;margin:0 0 4px;color:var(--gold)}
h3{font-size:17px;margin:20px 0 8px;color:var(--cyan)}
.sub{color:var(--dim);margin:0 0 16px;font-size:16px}
.card{background:var(--card);border-radius:18px;padding:14px}
.lvl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;margin-bottom:14px}
.lvl .lv{font-size:26px;font-weight:700;color:var(--gold)}
.lvl .bar{height:12px;background:#14092a;border-radius:8px;overflow:hidden}
.lvl .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));border-radius:8px}
.lvl small{grid-column:1/3;color:var(--dim);font-size:14px}
.games{display:grid;gap:10px;margin-bottom:14px}
.gcard{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;text-align:left;border:0;background:var(--card);border-radius:18px;padding:12px 14px}
.gcard:active,.btn:active{transform:scale(.98)}
.gcard b{font-size:34px;font-weight:400;text-align:center}
.gcard strong{display:block;font-size:19px}
.gcard em{display:block;font-style:normal;color:var(--dim);font-size:14px;line-height:1.25}
.gcard small{color:var(--cyan);font-size:13px;text-align:right}
.row{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:16px;padding:13px;background:var(--sel);font-weight:700;font-size:16px}
.btn.pri{background:var(--gold);color:#2a1450}
.back{border:0;background:none;color:var(--dim);font-size:16px;padding:4px 0 10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tabs button{flex:none;border:0;border-radius:12px;padding:8px 12px;background:var(--card);color:var(--dim);font-weight:500}
.tabs button.on{background:var(--sel);color:var(--gold)}
.items{display:grid;gap:10px}
.item{display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:12px}
.item.lock{opacity:.6}
.item b{font-size:32px;font-weight:400;text-align:center}
.item strong{display:block;font-size:17px}
.item em{display:block;font-style:normal;color:var(--dim);font-size:13px;line-height:1.25}
.item button{border:0;border-radius:12px;padding:8px 12px;background:var(--gold);color:#2a1450;font-weight:700;font-size:14px}
.item button.on{background:var(--sel);color:var(--cyan)}
.item .tag{color:var(--dim);font-size:13px;text-align:right}
.code{display:flex;gap:8px;margin:6px 0 4px}
.code input{flex:1;min-width:0;border:2px solid var(--sel);background:#14092a;color:var(--ink);border-radius:14px;padding:12px;font:inherit;font-size:16px;-webkit-user-select:text;user-select:text}
.code button{border:0;border-radius:14px;padding:0 16px;background:var(--cyan);color:#10202b;font-weight:700}
#msg{min-height:20px;font-size:14px;color:var(--cyan);margin-bottom:6px}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #2c1d4a}
.seg{display:flex;background:#14092a;border-radius:12px;padding:3px}
.seg button{border:0;background:none;color:var(--dim);padding:6px 10px;border-radius:9px;font-size:14px}
.seg button.on{background:var(--sel);color:var(--gold)}
.tog{width:52px;height:30px;border:0;border-radius:16px;background:#14092a;position:relative}
.tog i{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--dim);transition:.2s}
.tog.on{background:var(--cyan)}
.tog.on i{left:26px;background:#10202b}
.modal{display:flex;min-height:100%;align-items:center;justify-content:center;text-align:center}
.modal .card{width:100%;padding:24px 18px}
.big{font-size:60px;margin:6px 0}
#top button.ic{position:relative}
#top button.ic.has::after{content:"";position:absolute;top:4px;right:4px;width:10px;height:10px;border-radius:50%;background:var(--coral);border:2px solid var(--panel)}
#toast{position:absolute;left:50%;top:72px;transform:translate(-50%,-30px);opacity:0;pointer-events:none;transition:transform .35s,opacity .35s;background:rgba(37,23,64,.94);border:2px solid var(--tc,var(--gold));border-radius:16px;padding:8px 14px;text-align:center;max-width:min(92%,420px);z-index:3;display:flex;flex-direction:column;gap:2px}
#toast.on{transform:translate(-50%,0);opacity:1}
#toast strong{color:var(--tc,var(--gold));font-size:17px}
#toast span{color:var(--ink);font-size:14px}
.mini{display:block;height:6px;border-radius:4px;background:#14092a;overflow:hidden;margin-top:6px}.mini i{display:block;height:100%;border-radius:4px}
.gl{font-size:14px;margin-left:6px}
.new{background:var(--coral);color:#fff;border-radius:8px;font-size:11px;padding:1px 6px;margin-left:6px;vertical-align:middle}
#app.camon #top{display:none}
#cam{position:absolute;inset:0;z-index:2;background:#000;overflow:hidden}
#cvid{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none}
#cam [hidden]{display:none!important}
#fl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#fl.on{animation:flsh .3s}
@keyframes flsh{0%{opacity:.9}100%{opacity:0}}
.ct{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:2}
.ct button{width:46px;height:46px;border:0;border-radius:50%;background:rgba(0,0,0,.4);font-size:22px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#chint{position:absolute;left:50%;top:22%;transform:translateX(-50%);padding:8px 14px;border-radius:16px;background:rgba(0,0,0,.55);font-size:15px;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
#chint.on{opacity:1}
#lname{position:absolute;left:0;right:0;bottom:112px;text-align:center;font-weight:700;font-size:15px;text-shadow:0 1px 6px #000;pointer-events:none}
#lens{position:absolute;left:0;right:0;bottom:8px;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px calc(50% - 33px);scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch}
#lens::-webkit-scrollbar{display:none}
.ln{flex:none;width:66px;height:66px;padding:0;border-radius:50%;border:4px solid rgba(255,255,255,.85);background:rgba(0,0,0,.35);font-size:30px;line-height:1;display:grid;place-items:center;scroll-snap-align:center;transform:scale(.72);opacity:.8;transition:transform .2s,opacity .2s;-webkit-touch-callout:none}
.ln.on{transform:scale(1.12);opacity:1;background:rgba(255,255,255,.18)}
.ln.rec{border-color:var(--coral);animation:rp 1s linear infinite}
@keyframes rp{50%{box-shadow:0 0 0 12px rgba(255,93,115,.35)}}
#cmsg{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.65);text-align:center}
#cmsg .card{max-width:340px}
#pv{position:absolute;inset:0;z-index:4;background:#000;display:flex;flex-direction:column}
#pv .m{flex:1;min-height:0;display:flex}
#pv img,#pv video{width:100%;height:100%;object-fit:contain}
#pv .row{padding:12px 12px 14px;background:var(--panel)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button class="chip" id="chip" aria-label="Open menu"><span id="lv">Lv 1</span><span class="xpbar"><i id="xpfill"></i></span></button>
    <span id="xpf"></span>
    <span class="sp"></span>
    <button class="ic" id="bColl" aria-label="Collection">&#127873;</button>
    <button class="ic" id="bSet" aria-label="Settings">&#9881;&#65039;</button>
  </header>
  <div id="stage"><canvas id="c"></canvas><div id="toast" role="status" aria-live="polite"></div>
    <div id="cam" hidden>
      <video id="cvid" playsinline muted autoplay></video><canvas id="cc"></canvas><div id="fl"></div>
      <div class="ct"><button data-c="flip" aria-label="Flip camera">&#128260;</button></div>
      <div id="chint" role="status"></div><div id="lname"></div><div id="lens" aria-label="Lenses"></div>
      <div id="cmsg" hidden><div class="card"><p id="cm"></p><button class="btn pri" data-c="retry">Try again</button></div></div>
      <div id="pv" hidden></div>
    </div>
  </div>
  <nav id="tabs" aria-label="Games"></nav>
</div>
<div id="ov" hidden></div>
<script>
(() => {
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, cur = null, paused = false, camOn = false;
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FONT = 'Fredoka, ui-rounded, system-ui, sans-serif';
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');

/* =====================================================
   SAVE DATA, SETTINGS, ITEMS, XP
   ===================================================== */
const SPEC = [
  { g: 'all', title: 'General', items: [
    { k: 'sound', label: 'Sound', t: 'tog', def: true },
    { k: 'vibe', label: 'Vibration', t: 'tog', def: true }] },
  { g: 'pop', title: 'Pin Pop', items: [
    { k: 'sway', label: 'Hand speed', t: 'ch', opts: ['Slow', 'Normal', 'Fast'], def: 1 },
    { k: 'guide', label: 'Center guide line', t: 'tog', def: true }] },
  { g: 'knife', title: 'Knife Hit', items: [
    { k: 'diff', label: 'Difficulty', t: 'ch', opts: ['Easy', 'Normal', 'Hard'], def: 1 }] },
  { g: 'stack', title: 'Stack', items: [
    { k: 'speed', label: 'Block speed', t: 'ch', opts: ['Chill', 'Normal', 'Fast'], def: 1 }] },
  { g: 'hop', title: 'Hop', items: [
    { k: 'gap', label: 'Gap size', t: 'ch', opts: ['Wide', 'Normal', 'Tight'], def: 1 }] },
  { g: 'snake', title: 'Snake', items: [
    { k: 'speed', label: 'Speed', t: 'ch', opts: ['Slow', 'Normal', 'Fast'], def: 1 },
    { k: 'wrap', label: 'Walls wrap around', t: 'tog', def: false }] }
];
const DEFS = {}; SPEC.forEach(s => { DEFS[s.g] = {}; s.items.forEach(i => DEFS[s.g][i.k] = i.def); });
let save = { xp: {}, codes: [], equip: {}, gs: {} };
try { const s = JSON.parse(localStorage.getItem('pa_save2')); if (s) save = Object.assign(save, s); } catch (e) {}
if (!save.xp || typeof save.xp !== 'object') save.xp = {}; // old saves had one shared XP number; each game has its own now
const persist = () => { try { localStorage.setItem('pa_save2', JSON.stringify(save)); } catch (e) {} };
const opt = (g, k) => { const v = save.gs[g] && save.gs[g][k]; return v === undefined ? DEFS[g][k] : v; };
const best = {
  get(k) { try { return +localStorage.getItem('pa_' + k) || 0; } catch (e) { return 0; } },
  set(k, v) { try { localStorage.setItem('pa_' + k, v); } catch (e) {} }
};

// Items are LOOKS ONLY: every one plays exactly the same. lvl = player level that unlocks it.
// Every game has its OWN level, so looks unlock by leveling up that game.
// Typing the item name in the Collection code box unlocks it early.
const ITEMS = {
  pop: [
    { id: 'pop_steel', name: 'Steel Pin', icon: '\uD83D\uDCCC', lvl: 1, desc: 'The classic silver pin.', st: 'pin' },
    { id: 'pop_pencil', name: 'Pencil', icon: '\u270F\uFE0F', lvl: 2, desc: 'Yellow pencil with a pink eraser.', st: 'pencil' },
    { id: 'pop_arrow', name: 'Arrow', icon: '\uD83C\uDFF9', lvl: 4, desc: 'Steel head and red feathers.', st: 'arrow' },
    { id: 'pop_bone', name: 'Bone Spike', icon: '\uD83E\uDDB4', lvl: 6, desc: 'A spooky sharpened bone.', st: 'bone' },
    { id: 'pop_pumpkin', name: 'Pumpkin Pin', icon: '\uD83C\uDF83', lvl: 9, desc: 'A jack-o-lantern pin with an ember trail.', st: 'pumpkin' },
    { id: 'pop_wand', name: 'Magic Wand', icon: '\uD83E\uDE84', lvl: 12, desc: 'A star-tipped wand that leaves sparkles.', st: 'wand' }],
  knife: [
    { id: 'kn_classic', name: 'Classic Blade', icon: '\uD83D\uDD2A', lvl: 1, desc: 'The standard throwing knife.', thr: 1, slow: 1, extra: 0, st: { shape: 'classic', b: ['#f6fafc', '#c3ccd6', '#8793a1'], g: '#ffd23f', h: '#6b3f26' } },
    { id: 'kn_ninja', name: 'Ninja Dagger', icon: '\uD83D\uDDE1\uFE0F', lvl: 2, desc: 'Slim dark dagger with a purple guard.', thr: 1, slow: 1, extra: 0, st: { shape: 'dagger', b: ['#d9d9ff', '#7d7da8', '#3a3a5c'], g: '#7d5cff', h: '#1c1c2e' } },
    { id: 'kn_flame', name: 'Flame Katana', icon: '\uD83D\uDD25', lvl: 4, desc: 'Long burning katana with a fire trail.', thr: 1, slow: 1, extra: 0, trail: ['#ff8a1f', '#ffd23f', '#ff3b3b'], st: { shape: 'katana', b: ['#fff2b0', '#ff8a1f', '#c2300f'], g: '#ff3b3b', h: '#3a1408' } },
    { id: 'kn_frost', name: 'Frost Saber', icon: '\u2744\uFE0F', lvl: 7, desc: 'Jagged ice crystal blade with a frosty trail.', thr: 1, slow: 1, extra: 0, trail: ['#aef2ff', '#ffffff'], st: { shape: 'saber', b: ['#f0fdff', '#8be4ff', '#3a9bd6'], g: '#aef2ff', h: '#1d3b58' } },
    { id: 'kn_royal', name: 'Royal Blade', icon: '\uD83D\uDC51', lvl: 10, desc: 'Wide golden sword with a ruby pommel.', thr: 1, slow: 1, extra: 0, trail: ['#ffd23f', '#fff6e5'], st: { shape: 'royal', b: ['#fffbe0', '#ffd23f', '#c48a00'], g: '#ffc400', h: '#4a1a5c' } },
    { id: 'kn_galaxy', name: 'Galaxy Blade', icon: '\uD83C\uDF0C', lvl: 14, desc: 'Curved star-dusted blade with a cosmic trail.', thr: 1, slow: 1, extra: 0, trail: ['#ff7ad9', '#9b6bff', '#ffffff'], st: { shape: 'galaxy', b: ['#ffd1f5', '#b36bff', '#3b1f8a'], g: '#ff7ad9', h: '#1a0b3a' } }],
  stack: [
    { id: 'st_classic', name: 'Classic Blocks', icon: '\uD83E\uDDF1', lvl: 1, desc: 'Plain rainbow blocks.', tol: 7, kind: 'classic', ag: 3 },
    { id: 'st_candy', name: 'Candy Blocks', icon: '\uD83C\uDF6C', lvl: 3, desc: 'Sweet candy-colored blocks.', tol: 7, kind: 'candy', ag: 3 },
    { id: 'st_neon', name: 'Neon Glass', icon: '\uD83D\uDCA0', lvl: 5, desc: 'Glowing neon glass blocks.', tol: 7, kind: 'neon', ag: 3 },
    { id: 'st_gold', name: 'Gold Bricks', icon: '\uD83D\uDFE8', lvl: 8, desc: 'Shiny gold bricks.', tol: 7, kind: 'gold', ag: 3 },
    { id: 'st_diamond', name: 'Diamond Blocks', icon: '\uD83D\uDC8E', lvl: 12, desc: 'Sparkling diamond blocks.', tol: 7, kind: 'diamond', ag: 3 }],
  hop: [
    { id: 'hp_chick', name: 'Chick', icon: '\uD83D\uDC25', lvl: 1, desc: 'A brave little bird.', body: '#ffd23f', wing: '#ffb21e', gapMul: 1, grav: 1, shield: 0, acc: '' },
    { id: 'hp_owl', name: 'Night Owl', icon: '\uD83E\uDD89', lvl: 3, desc: 'Brown feathers and little ears.', body: '#b78a5a', wing: '#7d5a36', gapMul: 1, grav: 1, shield: 0, acc: 'ears' },
    { id: 'hp_jet', name: 'Jet Duck', icon: '\uD83E\uDD86', lvl: 6, desc: 'Blue duck with a fiery trail.', body: '#5ab0ff', wing: '#ff8a1f', gapMul: 1, grav: 1, shield: 0, acc: 'jet', trail: ['#ff8a1f', '#ffd23f'] },
    { id: 'hp_ghost', name: 'Ghost Bird', icon: '\uD83D\uDC7B', lvl: 9, desc: 'A see-through spooky bird.', body: '#e9e3ff', wing: '#b8aef0', gapMul: 1, grav: 1, shield: 0, acc: 'ghost' },
    { id: 'hp_phoenix', name: 'Phoenix', icon: '\uD83E\uDD85', lvl: 13, desc: 'Flaming feathers, a crest and a fire trail.', body: '#ff6a3d', wing: '#ffd23f', gapMul: 1, grav: 1, shield: 0, acc: 'crest', trail: ['#ff3b3b', '#ff8a1f', '#ffd23f'] }],
  snake: [
    { id: 'sn_classic', name: 'Classic Snake', icon: '\uD83D\uDC0D', lvl: 1, desc: 'Teal to purple.', pal: [170, 285], speed: 1, xp: 1, mul: 1, wrap: 0 },
    { id: 'sn_lava', name: 'Lava Snake', icon: '\uD83C\uDF0B', lvl: 2, desc: 'Red to orange, like molten rock.', pal: [5, 50], speed: 1, xp: 1, mul: 1, wrap: 0 },
    { id: 'sn_ice', name: 'Ice Serpent', icon: '\uD83E\uDDCA', lvl: 5, desc: 'Cool icy blues.', pal: [185, 225], speed: 1, xp: 1, mul: 1, wrap: 0 },
    { id: 'sn_gold', name: 'Golden Cobra', icon: '\uD83C\uDFC5', lvl: 8, desc: 'Shiny gold scales.', pal: [48, 36], speed: 1, xp: 1, mul: 1, wrap: 0 },
    { id: 'sn_drake', name: 'Rainbow Drake', icon: '\uD83D\uDC09', lvl: 12, desc: 'A color-shifting rainbow dragon.', pal: null, speed: 1, xp: 1, mul: 1, wrap: 0 }]
};
// Each game has its own XP curve, banner color/icon/title and level-up sound.
const LV = {
  pop:   { base: 40, step: 20, icon: '\uD83C\uDF88', col: '#ff5d73', title: 'Pop Rank', hap: [20, 30, 20, 30, 20, 30, 60] },
  knife: { base: 60, step: 30, icon: '\uD83C\uDF4E', col: '#ff8a1f', title: 'Blade Rank', hap: [70, 30, 70] },
  stack: { base: 40, step: 15, icon: '\uD83E\uDDF1', col: '#3ee0cf', title: 'Tower Level', hap: [30, 30, 60, 30, 90] },
  hop:   { base: 30, step: 15, icon: '\uD83D\uDC25', col: '#ffd23f', title: 'Flight Level', hap: [15, 25, 15, 25, 15, 25, 15] },
  snake: { base: 40, step: 12, icon: '\uD83D\uDC0D', col: '#7be04a', title: 'Snake Length', hap: [20, 20, 40, 20, 60, 20, 80] }
};
Object.keys(ITEMS).forEach(g => ITEMS[g].forEach(i => { i.g = g; }));
const need = (g, n) => LV[g].base + LV[g].step * n;
function lvlInfo(xp, g) { let l = 1; while (xp >= need(g, l)) { xp -= need(g, l); l++; } return { l, cur: xp, need: need(g, l) }; }
const level = g => lvlInfo(save.xp[g] || 0, g).l;
const unlocked = it => it.lvl <= level(it.g) || save.codes.includes(it.id) || save.codes.includes('*');
const eqItem = g => ITEMS[g].find(i => i.id === save.equip[g] && unlocked(i)) || ITEMS[g][0];
const GAMES = [
  { id: 'pop', name: 'Pin Pop', icon: '\uD83C\uDF88', tag: 'Touch a balloon with the needle and it pops. Line up to pop them all.' },
  { id: 'knife', name: 'Knife Hit', icon: '\uD83C\uDF4E', tag: 'Throw every knife into the spinning apple without a clash.' },
  { id: 'stack', name: 'Stack', icon: '\uD83E\uDDF1', tag: 'Drop blocks and build the tallest tower you can.' },
  { id: 'hop', name: 'Hop', icon: '\uD83D\uDC25', tag: 'Tap to flap through the gaps.' },
  { id: 'snake', name: 'Snake', icon: '\uD83D\uDC0D', tag: 'Swipe to eat apples and grow.' }

// "seen" tracks which unlocked looks the player has already looked at, so new ones can show a NEW tag.
function initSeen() {
  if (!Array.isArray(save.seen)) { save.seen = []; GAMES.forEach(g => ITEMS[g.id].forEach(i => { if (unlocked(i)) save.seen.push(i.id); })); persist(); }
}
const isNew = it => unlocked(it) && !save.seen.includes(it.id);
function markSeen(g) { ITEMS[g].forEach(i => { if (unlocked(i) && !save.seen.includes(i.id)) save.seen.push(i.id); }); persist(); updateTop(); }
initSeen();

/* ---------- audio, haptics, drawing helpers ---------- */
let ac = null, nbuf = null;

  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + (o.atk || .004)); g.gain.exponentialRampToValueAtTime(.0001, t + d);

const semi = (base, n) => base * Math.pow(2, n / 12);

    case 'pop': noise(.07, .22, { type: 'highpass', f: 1800 }); tone(260 + Math.min(a, 12) * 22, .09, 'sine', .16, { to: 70 }); break;
    case 'win': [0, 4, 7, 12, 16].forEach((n, i) => bell(semi(523, n), .09, .7, i * .09)); break;
    case 'stab': noise(.06, .2, { type: 'lowpass', f: 1400 }); tone(170 + Math.min(a, 12) * 6, .1, 'triangle', .2, { to: 70 }); break;
    case 'clash': noise(.18, .2, { type: 'highpass', f: 3000 }); tone(1180, .3, 'square', .06, { to: 900 }); tone(1420, .3, 'square', .05, { to: 1100 }); tone(110, .3, 'sawtooth', .1, { to: 50 }); break;
    case 'smash': noise(.35, .3, { type: 'lowpass', f: 2600, to: 300 }); tone(200, .25, 'sine', .25, { to: 45 }); noise(.1, .15, { type: 'highpass', f: 2500, at: .05 }); break;
    case 'crash': noise(.5, .18, { type: 'lowpass', f: 900, to: 120 }); tone(150, .5, 'sine', .2, { to: 40 }); break;
    case 'bell': bell(semi(440, PENT[a % 5] + 12 * Math.floor(a / 5)), .1, .55); break;
    case 'knock': tone(200, .08, 'sine', .2, { to: 90 }); noise(.04, .12, { type: 'lowpass', f: 1200 }); break;
    case 'flap': noise(.09, .08, { type: 'bandpass', f: 700, to: 1500, q: .8 }); tone(300, .07, 'sine', .05, { to: 520 }); break;
    case 'ping': bell(semi(660, PENT[a % 5]), .07, .3); break;
    case 'chomp': noise(.05, .16, { type: 'bandpass', f: 1800, q: 3 }); tone(semi(330, Math.min(a, 12)), .08, 'square', .05, { to: semi(330, Math.min(a, 12)) * 1.5 }); break;

// every game has its own level-up sound
function lvlSound(g) {

    pop() { PENT.concat([12]).forEach((n, i) => tone(semi(500, n), .12, 'sine', .08, { at: i * .06, to: semi(500, n) * 1.4 })); },
    knife() { noise(.12, .2, { type: 'highpass', f: 3500 }); bell(988, .08, .7); bell(1318, .07, .7, .12); },
    stack() { [0, 4, 7, 12].forEach((n, i) => tone(semi(262, n), .5, 'triangle', .1, { at: i * .1 })); },
    hop() { [0, 5, 9, 12].forEach((n, i) => tone(semi(700, n), .08, 'square', .045, { at: i * .07, to: semi(700, n) * 1.25 })); },

  text(title, W / 2, H * .3, Math.min(46, W * .12), '#ffd23f');

    text(l, W / 2, H * .3 + 46 + i * 34, last ? 20 : 24, last ? '#3ee0cf' : isXp ? '#3ee0cf' : '#fff6e5');

function Particles() {

    burst(x, y, n, color, sp = 240, life = .8, size = 6, grav = 600, round = false) {
      for (let i = 0; i < n; i++) {
        const a = rnd(0, TAU), s = rnd(.3, 1) * sp;
        p.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * rnd(.6, 1), max: life, round,
          color: Array.isArray(color) ? color[Math.random() * color.length | 0] : color,
          size: rnd(size * .5, size), grav, rot: rnd(0, TAU), vr: rnd(-8, 8) });

    update(dt) {
      for (let i = p.length - 1; i >= 0; i--) {

      for (const q of p) {

    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);

  ctx.closePath();

/* ---------- per-game XP + level ups ---------- */
let xpAcc = 0, xpTimer = 0;
const $ = id => document.getElementById(id);
const curG = () => GAMES[curIdx].id;
function updateTop() {
  const g = curG(), li = lvlInfo(save.xp[g] || 0, g);
  $('lv').textContent = 'Lv ' + li.l; $('xpfill').style.width = Math.round(li.cur / li.need * 100) + '%';
  $('bColl').classList.toggle('has', GAMES.some(x => ITEMS[x.id].some(isNew)));
}
function award(n) {
  n = Math.round(n); if (n <= 0) return;
  const g = curG(), before = level(g); save.xp[g] = (save.xp[g] || 0) + n; persist(); updateTop();
  xpAcc += n; $('xpf').textContent = '+' + xpAcc + ' XP'; $('xpf').classList.add('on');
  clearTimeout(xpTimer); xpTimer = setTimeout(() => { $('xpf').classList.remove('on'); xpAcc = 0; }, 1500);
  const after = level(g);
  if (after > before) levelUp(g, before, after);
}
// Level-ups never pause or cover the game: a small banner slides in at the top and leaves by itself.
// Each game has its own banner color, icon, title and sound.
let toastQ = [], toastBusy = false;
function toast(col, html) { toastQ.push([col, html]); if (!toastBusy) nextToast(); }
function nextToast() {
  const q = toastQ.shift(); if (!q) { toastBusy = false; return; }
  toastBusy = true; const el = $('toast'); el.style.setProperty('--tc', q[0]); el.innerHTML = q[1]; el.classList.add('on');
  setTimeout(() => { el.classList.remove('on'); setTimeout(nextToast, 400); }, 3200);
}
function levelUp(g, a, b) {
  const L = LV[g], gm = GAMES.find(x => x.id === g), fresh = ITEMS[g].filter(it => it.lvl > a && it.lvl <= b);
  lvlSound(g); vib(L.hap);
  toast(L.col, `<strong>${L.icon} ${L.title} ${b}!</strong>` + (fresh.length
    ? fresh.map(it => `<span>${it.icon} New look: ${it.name}</span>`).join('') + '<span style="color:var(--dim);font-size:12px">Equip it in \uD83C\uDF81 Collection</span>'
    : `<span>${gm.name} level up!</span>`));

}

/* =====================================================
   GAME 1: PIN POP
   Hand slides side to side by itself. Tap to fire the needle
   straight up. The balloon line runs from big (near) to small (far).
   ===================================================== */
const PinPop = (() => {

      if (!b.alive) continue;
      const r = big - (big - small) * (b.k / (N - 1));

  function reset() {
    bs = []; for (let k = 0; k < N; k++) bs.push({ k, c: COLS[k % COLS.length], alive: true, r: 1, h: 0, tr: 1, th: 0 });
    targets(); bs.forEach(b => { b.r = b.tr; b.h = b.th; });
    popped = 0; shots = 0; t = 0; phase = 0; state = 'aim'; stT = 0; ndl = null; cam = 0; confT = 0; floats = []; shotHits = 0; earned = 0;
    it = eqItem('pop'); bestS = best.get('pop'); pt.clear(); hx = W / 2;
  }
  function handX() { return W / 2 + Math.sin(phase) * W * .4; }

    if (state !== 'aim') return;

    hx = ndl.x; state = 'fly'; shots++; shotHits = 0; snd('whoosh', 1); vib(12);
  }
  function endShot() {
    state = 'look'; stT = 0;
    const m = Math.round((ndl.h - 135) / 10);

    floats.push({ s: `${m} m`, x: ndl.x, h: ndl.h + 4, life: 1.4, col: '#3ee0cf' });
    if (!ndl.hits) vib([25, 40, 25]);

      for (const b of bs) {
        if (!b.alive) continue;
        const dx = (ndl.x - W / 2) / (b.r + NW), dy = (ndl.h - (b.h - b.r * .08)) / (b.r * 1.17);

          b.alive = false; popped++; ndl.hits++; earned += 2; award(2);
          pt.burst(W / 2, sy(b.h), 16, b.c, 280, .7, 8, 500, true);
          snd('pop', ndl.hits); vib(8);
        }

      ctx.strokeStyle = '#c2500f'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(x, tailY + 2, 5, 10, 0, 0, TAU); ctx.stroke();

/* =====================================================
   GAME 3: STACK
   ===================================================== */
const Stack = (() => {
  const pt = Particles();

  const bh = () => Math.max(24, Math.min(34, H * .045)), baseY = () => H * .78;
  const yOf = i => baseY() - i * bh() + cam;
  function reset() {
    it = eqItem('stack'); bw0 = Math.min(W * .5, 230); blocks = [{ x: (W - bw0) / 2, w: bw0, hue: 200 }];
    score = 0; cam = 0; debris = []; perfect = 0; state = 'play'; msgT = 0; stT = 0; runXP = 0; pt.clear(); bestS = best.get('stack'); spawn();
  }
  function spawn() {
    const top = blocks[blocks.length - 1], fromLeft = blocks.length % 2 === 0;
    cur = { w: top.w, x: fromLeft ? 0 : W - top.w, hue: (200 + blocks.length * 11) % 360 };
    dir = fromLeft ? 1 : -1; speed = Math.min(560, 230 + score * 9) * [.8, 1, 1.25][opt('stack', 'speed')];
  }
  function drop() {
    if (state === 'over') { if (stT > .6) reset(); return; }
    const top = blocks[blocks.length - 1], left = Math.max(cur.x, top.x), right = Math.min(cur.x + cur.w, top.x + top.w), ov = right - left;
    if (ov <= 0) {
      debris.push({ x: cur.x, w: cur.w, i: blocks.length, dy: 0, vy: 0, vx: dir * 60, hue: cur.hue });
      state = 'over'; stT = 0; snd('crash'); vib([90, 40, 90]);
      if (score > bestS) { bestS = score; best.set('stack', score); }
      return;
    }
    let gain = 1;
    if (Math.abs(cur.x - top.x) < it.tol) {
      cur.x = top.x; cur.w = top.w; perfect++; msgT = 1; gain = 3;
      if (perfect >= it.ag) { const nw = Math.min(bw0, cur.w + 14); cur.x -= (nw - cur.w) / 2; cur.w = nw; }
      pt.burst(cur.x + cur.w / 2, yOf(blocks.length), 16, ['#fff6e5', '#ffd23f'], 260, .6, 6, 300, true);
      snd('bell', Math.min(perfect, 9)); vib(12 + Math.min(perfect, 8) * 3);
    } else {

      if (cur.x < top.x) debris.push({ x: cur.x, w: top.x - cur.x, i: blocks.length, dy: 0, vy: 0, vx: -50, hue: cur.hue });
      else debris.push({ x: top.x + top.w, w: cur.x + cur.w - (top.x + top.w), i: blocks.length, dy: 0, vy: 0, vx: 50, hue: cur.hue });
      cur.x = left; cur.w = ov; snd('knock'); vib(8);

      ctx.shadowColor = `hsl(${hue} 100% 62%)`; ctx.shadowBlur = 12; ctx.strokeStyle = `hsl(${hue} 100% 66%)`; ctx.lineWidth = 2.5; rr(x + 1, y + 1, w - 2, h - 2, 5); ctx.stroke(); ctx.shadowBlur = 0;
    } else if (k === 'candy') {

    <div class="tabs">${GAMES.map(g => `<button class="${g.id === collG ? 'on' : ''}" data-act="ctab" data-g="${g.id}">${g.icon} ${g.name}${ITEMS[g.id].some(isNew) ? ' \u2022' : ''}</button>`).join('')}</div>
    <p class="sub" style="margin:4px 0 10px">${GAMES.find(x => x.id === collG).name} Lv ${level(collG)}. Level up this game to unlock its looks.</p>
    <div class="items">${ITEMS[collG].map(i => {
      const u = unlocked(i), on = i.id === eq;
      return `<div class="item ${u ? '' : 'lock'}"><b>${u ? i.icon : '\uD83D\uDD12'}</b><span><strong>${i.name}${isNew(i) ? '<span class="new">NEW</span>' : ''}</strong><em>${i.desc}</em></span>${u ? `<button class="${on ? 'on' : ''}" data-act="equip" data-g="${collG}" data-id="${i.id}">${on ? 'Equipped' : 'Equip'}</button>` : `<span class="tag">Unlocks at<br>Lv ${i.lvl}</span>`}</div>`;
    }).join('')}</div></div>`);
  markSeen(collG);
}
function showSet() {
  openOv(`<div class="scr"><button class="back" data-act="back">\u2190 Back</button><h2>Settings</h2><p class="sub">Changes restart the current round.</p>
    ${SPEC.map(s => `<h3>${s.title}</h3>${s.items.map(i => {
      const v = opt(s.g, i.k);
      return `<div class="set"><span>${i.label}</span>${i.t === 'tog'
        ? `<button class="tog ${v ? 'on' : ''}" data-act="tog" data-g="${s.g}" data-k="${i.k}" aria-pressed="${!!v}"><i></i></button>`
        : `<span class="seg">${i.opts.map((o, n) => `<button class="${n === v ? 'on' : ''}" data-act="ch" data-g="${s.g}" data-k="${i.k}" data-v="${n}">${o}</button>`).join('')}</span>`}</div>`;
    }).join('')}`).join('')}
    <h3>Progress</h3><div class="set"><span>Reset all XP, codes and bests</span><button class="btn" style="flex:none;padding:8px 14px" data-act="wipe">Reset</button></div></div>`);
}
function setOpt(g, k, v) { save.gs[g] = save.gs[g] || {}; save.gs[g][k] = v; persist(); dirty = true; }
function tryCode() {
  const v = norm($('code').value); if (!v) return;
  let found = null;
  if (v === 'unlockall') { save.codes = ['*']; persist(); msg = 'Everything unlocked.'; return showColl(); }
  GAMES.forEach(g => ITEMS[g.id].forEach(i => { if (norm(i.name) === v || norm(i.id) === v) found = [g, i]; }));
  if (!found) { msg = 'No item with that name. Check the spelling.'; return showColl(); }
  const [g, i] = found;
  if (unlocked(i)) msg = `${i.name} is already unlocked.`;
  else { save.codes.push(i.id); if (!save.seen.includes(i.id)) save.seen.push(i.id); msg = `Unlocked ${i.name}!`; snd('unlock'); vib(20); }
  save.equip[g.id] = i.id; persist(); dirty = true; collG = g.id; showColl();
}
ov.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act; vib(6);
  if (a === 'play') select(+b.dataset.i);
  else if (a === 'cam') { ov.hidden = true; ov.innerHTML = ''; Cam.open(); }
  else if (a === 'coll') { msg = ''; showColl(); }
  else if (a === 'set') showSet();
  else if (a === 'back') { from === 'menu' ? showMenu() : closeOv(); }
  else if (a === 'close') closeOv();
  else if (a === 'ctab') { collG = b.dataset.g; showColl(); }
  else if (a === 'equip') {
    save.equip[b.dataset.g] = b.dataset.id; persist(); dirty = true; collG = b.dataset.g;
    if (b.dataset.back) closeOv(); else { msg = ''; showColl(); }
  }
  else if (a === 'code') tryCode();
  else if (a === 'tog') { setOpt(b.dataset.g, b.dataset.k, !opt(b.dataset.g, b.dataset.k)); showSet(); }
  else if (a === 'ch') { setOpt(b.dataset.g, b.dataset.k, +b.dataset.v); showSet(); }
  else if (a === 'wipe') { if (confirm('Reset all XP, unlock codes, equipped gear and best scores?')) { try { localStorage.clear(); } catch (_) {} save = { xp: {}, codes: [], equip: {}, gs: {}, seen: null }; initSeen(); updateTop(); dirty = true; showMenu(); } }
});
ov.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'code') tryCode(); });
$('chip').addEventListener('click', showMenu);
$('bColl').addEventListener('click', () => { if (ov.hidden) collG = curG(); from = ov.hidden ? 'game' : from; msg = ''; showColl(); });
$('bSet').addEventListener('click', () => { from = ov.hidden ? 'game' : from; showSet(); });

/* ---------- tabs, input, main loop ---------- */
const homeBtn = document.createElement('button');
homeBtn.innerHTML = '<b>\uD83C\uDFE0</b>Menu'; homeBtn.addEventListener('click', showMenu); nav.appendChild(homeBtn);
GAMES.forEach((g, i) => {
  const b = document.createElement('button'); b.innerHTML = `<b>${g.icon}</b>${g.name}`;
  b.addEventListener('click', () => select(i)); g.el = b; nav.appendChild(b);
});
const camBtn = document.createElement('button');
camBtn.innerHTML = '<b>\uD83D\uDCF7</b>Camera'; camBtn.addEventListener('click', () => { ov.hidden = true; ov.innerHTML = ''; Cam.open(); }); nav.insertBefore(camBtn, GAMES[2].el);
function syncNav() { GAMES.forEach((g, i) => g.el.setAttribute('aria-selected', !paused && i === curIdx)); homeBtn.setAttribute('aria-selected', paused && from === 'menu' && !ov.hidden); camBtn.setAttribute('aria-selected', camOn && ov.hidden); }
function select(i) { Cam.close(); curIdx = i; cur = ENGINE[GAMES[i].id]; dirty = false; cur.reset(); ov.hidden = true; ov.innerHTML = ''; paused = false; syncNav(); updateTop(); }
function resize() {
  const r = cv.parentElement.getBoundingClientRect(), ow = W, oh = H;
  DPR = Math.min(window.devicePixelRatio || 1, 2); W = r.width; H = r.height;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (cur && (Math.abs(W - ow) > 80 || Math.abs(H - oh) > 160)) cur.reset();
}
const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
cv.addEventListener('pointerdown', e => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) {} const p = pos(e); cur.down && cur.down(p.x, p.y); });
cv.addEventListener('pointermove', e => { const p = pos(e); cur.move && cur.move(p.x, p.y); });
cv.addEventListener('pointerup', e => { const p = pos(e); cur.up && cur.up(p.x, p.y); });
cv.addEventListener('pointercancel', () => { cur.up && cur.up(); });
window.addEventListener('keydown', e => {
  if (paused) return;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  const n = parseInt(e.key, 10); if (n >= 1 && n <= GAMES.length) { select(n - 1); return; }
  cur.key && cur.key(e);
});
window.addEventListener('resize', resize);
updateTop(); resize();
cur = PinPop; cur.reset(); showMenu();
let last = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  if (camOn) { if (ov.hidden) Cam.frame(now); } else { if (!paused) cur.update(dt); cur.draw(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
